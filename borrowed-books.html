<!DOCTYPE html>
<html>
<head>
    <title>Borrowed Books</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>📚 My Borrowed Books</h1>

<div class="card">

    <h2>Borrowed Books</h2>

    <table border="1" width="100%">

        <thead>
            <tr>
                <th>Book Name</th>
                <th>Book ID / ISBN</th>
                <th>Issue Date</th>
                <th>Due Date</th>
            </tr>
        </thead>

        <tbody id="borrowedTable">
        </tbody>

    </table>

    <p id="message"></p>

</div>

<br>

<button type="button"
onclick="window.location.href='student-dashboard.html'">
    Back to Student Dashboard
</button>

<script>

function loadBorrowedBooks() {

    let issuedBooks =
        JSON.parse(localStorage.getItem("issuedBooks")) || [];

    let studentId =
        localStorage.getItem("studentId");

    let table =
        document.getElementById("borrowedTable");

    let message =
        document.getElementById("message");

    table.innerHTML = "";

    if (!studentId) {
        message.innerText =
            "Please register/login as a student first.";
        return;
    }

    let borrowedBooks = issuedBooks.filter(function(book) {

        return book.studentId === studentId;

    });

    if (borrowedBooks.length === 0) {

        message.innerText =
            "No borrowed books found.";

        return;
    }

    borrowedBooks.forEach(function(book) {

        let row = table.insertRow();

        row.insertCell(0).innerText =
            book.bookName;

        row.insertCell(1).innerText =
            book.bookId;

        row.insertCell(2).innerText =
            book.issueDate;

        row.insertCell(3).innerText =
            book.dueDate;

    });
}

loadBorrowedBooks();

</script>

</body>
</html>
