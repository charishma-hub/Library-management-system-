<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Borrowed Books | Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8fc;
            color: #1f2937;
        }

        /* HEADER */

        header {
            background: linear-gradient(135deg, #0d2b4d, #1976d2);
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 10px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        /* CONTAINER */

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        /* CARD */

        .card {
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 22px;
            color: #12395b;
        }

        /* TABLE */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th {
            background: #12395b;
            color: white;
            padding: 15px;
            text-align: left;
            font-size: 13px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f5f9ff;
        }

        .book-name {
            color: #1565c0;
            font-weight: bold;
        }

        .date {
            color: #475467;
        }

        /* EMPTY MESSAGE */

        #message {
            text-align: center;
            color: #667085;
            font-weight: bold;
            padding: 20px;
            margin: 0;
        }

        /* BACK BUTTON */

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 22px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: bold;
        }

        .back:hover {
            background: #1565c0;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header h1 {
                font-size: 25px;
            }

            .container {
                padding: 25px 15px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>📚 My Borrowed Books</h1>

    <p>
        View your currently borrowed books and due dates
    </p>

</header>


<div class="container">

    <div class="card">

        <h2>📖 Currently Borrowed</h2>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>Book Name</th>
                        <th>Book ID / ISBN</th>
                        <th>Issue Date</th>
                        <th>Due Date</th>
                    </tr>

                </thead>

                <tbody id="borrowedTable">
                </tbody>

            </table>

        </div>

        <p id="message"></p>

    </div>


    <a
        class="back"
        href="student-dashboard.html">
        ← Back to Student Dashboard
    </a>

</div>


<script>

function loadBorrowedBooks() {

    let issuedBooks =
        JSON.parse(localStorage.getItem("issuedBooks")) || [];

    let studentId =
        localStorage.getItem("studentId");

    let table =
        document.getElementById("borrowedTable");

    let message =
        document.getElementById("message");

    table.innerHTML = "";
    message.innerText = "";


    if (!studentId) {

        message.innerText =
            "Please register/login as a student first.";

        return;
    }


    let borrowedBooks =
        issuedBooks.filter(function(book) {

            return book.studentId === studentId;

        });


    if (borrowedBooks.length === 0) {

        message.innerText =
            "📚 No borrowed books found.";

        return;
    }


    borrowedBooks.forEach(function(book) {

        let row =
            table.insertRow();


        let nameCell =
            row.insertCell(0);

        nameCell.innerText =
            book.bookName || "Unknown Book";

        nameCell.className =
            "book-name";


        let idCell =
            row.insertCell(1);

        idCell.innerText =
            book.bookId || "N/A";


        let issueCell =
            row.insertCell(2);

        issueCell.innerText =
            book.issueDate || "N/A";

        issueCell.className =
            "date";


        let dueCell =
            row.insertCell(3);

        dueCell.innerText =
            book.dueDate || "N/A";

        dueCell.className =
            "date";

    });

}


loadBorrowedBooks();

</script>

</body>

</html>
