<!DOCTYPE html>
<html>
<head>
    <title>Borrowing History</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>📖 Borrowing History</h1>

<div class="card">

    <h2>My Borrowing History</h2>

    <table border="1" width="100%">

        <thead>
            <tr>
                <th>Book Name</th>
                <th>Book ID / ISBN</th>
                <th>Issue Date</th>
                <th>Return Date</th>
            </tr>
        </thead>

        <tbody id="historyTable">
        </tbody>

    </table>

    <p id="message"></p>

</div>

<br>

<button type="button"
onclick="window.location.href='student-dashboard.html'">
    Back to Student Dashboard
</button>

<script>

function loadHistory() {

    let history =
        JSON.parse(localStorage.getItem("borrowingHistory")) || [];

    let studentId =
        localStorage.getItem("studentId");

    let table =
        document.getElementById("historyTable");

    let message =
        document.getElementById("message");

    table.innerHTML = "";

    if (!studentId) {
        message.innerText =
            "Please register/login as a student first.";
        return;
    }

    let myHistory = history.filter(function(book) {
        return book.studentId === studentId;
    });

    if (myHistory.length === 0) {
        message.innerText =
            "No borrowing history found.";
        return;
    }

    myHistory.forEach(function(book) {

        let row = table.insertRow();

        row.insertCell(0).innerText =
            book.bookName;

        row.insertCell(1).innerText =
            book.bookId;

        row.insertCell(2).innerText =
            book.issueDate;

        row.insertCell(3).innerText =
            book.returnDate;
    });
}

loadHistory();

</script>

</body>
</html>
