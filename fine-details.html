<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fine Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        header {
            background: #1e3a5f;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 25px;
        }

        .fine-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .amount {
            color: #c62828;
            font-size: 24px;
            font-weight: bold;
        }

        .paid {
            color: green;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 18px;
            background: #1e3a5f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<header>
    <h1>💰 Fine Details</h1>
    <p>View your library fines and payment details</p>
</header>

<div class="container">

    <div class="fine-box">
        <h2>Late Return Fine</h2>
        <p>Book: Database Management Systems</p>
        <p>Days Late: 2</p>
        <p>Fine Amount: <span class="amount">₹20</span></p>
        <p>Status: <strong>Pending</strong></p>
    </div>

    <div class="fine-box">
        <h2>Payment History</h2>
        <p>Previous Fine: ₹10</p>
        <p>Status: <span class="paid">Paid</span></p>
    </div>

    <a class="back" href="student-dashboard.html">
        ← Back to Student Dashboard
    </a>

</div>

</body>
</html>
