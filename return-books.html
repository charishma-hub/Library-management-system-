<!DOCTYPE html>
<html>
<head>
    <title>Return Books</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>📚 Return Books</h1>

<div class="card">

    <h2>Return Book</h2>

    <input type="text"
           id="studentId"
           placeholder="Enter Student ID">

    <input type="text"
           id="bookId"
           placeholder="Enter Book ID / ISBN">

    <label>Return Type</label>

    <select id="returnType">
        <option value="Normal">Normal Return</option>
        <option value="Lost">Lost Book</option>
        <option value="Damaged">Damaged Book</option>
    </select>

    <br><br>

    <button type="button" onclick="returnBook()">
        Return Book
    </button>

    <p id="result"></p>

</div>

<br>

<button type="button"
        onclick="window.location.href='librarian-dashboard.html'">
    Back to Librarian Dashboard
</button>


<script>

function returnBook() {

    let studentId =
        document.getElementById("studentId").value.trim();

    let bookId =
        document.getElementById("bookId").value.trim();

    let returnType =
        document.getElementById("returnType").value;


    /* Validate input */

    if (studentId === "" || bookId === "") {

        alert("Please enter Student ID and Book ID.");

        return;
    }


    /* Get books */

    let books =
        JSON.parse(localStorage.getItem("books")) || [];


    /* Find book */

    let book = books.find(function(b) {

        return b.isbn === bookId;

    });


    if (!book) {

        alert("Book not found!");

        return;
    }


    /* Get issued books */

    let issuedBooks =
        JSON.parse(localStorage.getItem("issuedBooks")) || [];


    /* Find issued record */

    let index =
        issuedBooks.findIndex(function(item) {

            return item.studentId === studentId &&
                   item.bookId === bookId;

        });


    if (index === -1) {

        alert("Issued book record not found!");

        return;
    }


    /* =========================
       BORROWING HISTORY
       ========================= */

    let borrowingHistory =
        JSON.parse(
            localStorage.getItem("borrowingHistory")
        ) || [];


    borrowingHistory.push({

        studentId: studentId,

        bookId: bookId,

        bookName: book.name,

        issueDate:
            issuedBooks[index].issueDate,

        returnDate:
            new Date()
            .toISOString()
            .split("T")[0]

    });


    localStorage.setItem(
        "borrowingHistory",
        JSON.stringify(borrowingHistory)
    );


    /* =========================
       FINE CALCULATION
       ========================= */

    let fines =
        JSON.parse(
            localStorage.getItem("fines")
        ) || [];


    let settingsFine =
        Number(
            localStorage.getItem("fine")
        ) || 10;


    let fineAmount = 0;

    let reason = "";


    /* LOST BOOK */

    if (returnType === "Lost") {

        fineAmount =
            settingsFine * 10;

        reason =
            "Lost Book";

    }


    /* DAMAGED BOOK */

    else if (returnType === "Damaged") {

        fineAmount =
            settingsFine * 5;

        reason =
            "Damaged Book";

    }


    /* NORMAL RETURN */

    else {

        let returnedDate =
            new Date();


        let dueDate =
            new Date(
                issuedBooks[index].dueDate
            );


        if (returnedDate > dueDate) {

            let daysLate =
                Math.ceil(
                    (returnedDate - dueDate) /
                    (1000 * 60 * 60 * 24)
                );


            fineAmount =
                daysLate * settingsFine;


            reason =
                "Late Return";

        }

    }


    /* SAVE FINE */

    if (fineAmount > 0) {

        fines.push({

            studentId: studentId,

            bookId: bookId,

            amount: fineAmount,

            reason: reason,

            status: "Pending",

            paymentDate: ""

        });


        localStorage.setItem(
            "fines",
            JSON.stringify(fines)
        );


        alert(
            "⚠️ " +
            reason +
            "! Fine: ₹" +
            fineAmount
        );

    }


    /* =========================
       UPDATE BOOK COPIES
       ========================= */

    /*
       Normal return:
       Increase available copies.

       Lost/Damaged:
       Do NOT increase copies.
    */

    if (returnType === "Normal") {

        book.copies =
            Number(book.copies) + 1;

    }


    localStorage.setItem(
        "books",
        JSON.stringify(books)
    );


    /* =========================
       REMOVE ISSUED RECORD
       ========================= */

    issuedBooks.splice(index, 1);


    localStorage.setItem(
        "issuedBooks",
        JSON.stringify(issuedBooks)
    );


    /* =========================
       SUCCESS MESSAGE
       ========================= */

    document.getElementById("result").innerText =
        "📚 Book " +
        book.name +
        " returned successfully.";


    if (returnType === "Lost") {

        document.getElementById("result").innerText +=
            " Status: Lost Book.";

    }


    else if (returnType === "Damaged") {

        document.getElementById("result").innerText +=
            " Status: Damaged Book.";

    }

}

</script>

</body>
</html>
