<!DOCTYPE html>
<html>
<head>
    <title>Return Books</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
        }

        header {
            background: #1e3a5f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0 15px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 20px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .back {
            background: #555;
        }

        #result {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #eef5ff;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>↩️ Return Books</h1>
</header>

<div class="container">

    <h2>Return Book</h2>

    <label>Student ID</label>
    <input type="text" id="studentId" placeholder="Enter Student ID">

    <label>Book ID / ISBN</label>
    <input type="text" id="bookId" placeholder="Enter Book ID or ISBN">

    <label>Return Date</label>
    <input type="date" id="returnDate">

    <label>Book Condition</label>
    <select id="condition">
        <option value="">Select Condition</option>
        <option>Good</option>
        <option>Damaged</option>
        <option>Lost</option>
    </select>

    <button onclick="returnBook()">
        Return Book
    </button>

    <div id="result"></div>

    <br>

    <button class="back"
        onclick="window.location.href='librarian-dashboard.html'">
        Back to Librarian Dashboard
    </button>

</div>

<script>

function returnBook() {

    let studentId = document.getElementById("studentId").value.trim();
    let bookId = document.getElementById("bookId").value.trim();

    if (studentId === "" || bookId === "") {
        alert("Please enter Student ID and Book ID / ISBN.");
        return;
    }

    let books = JSON.parse(localStorage.getItem("books")) || [];

    let book = books.find(function(b) {
        return b.isbn === bookId;
    });

    if (!book) {
        alert("Book not found!");
        return;
    }

    // Increase available copies
    book.copies = Number(book.copies) + 1;

    localStorage.setItem("books", JSON.stringify(books));

    // Remove the returned book from issued books
    let issuedBooks =
        JSON.parse(localStorage.getItem("issuedBooks")) || [];

    let index = issuedBooks.findIndex(function(item) {
        return item.studentId === studentId &&
               item.bookId === bookId;
    });

    if (index !== -1) {
        issuedBooks.splice(index, 1);
    }

    localStorage.setItem(
        "issuedBooks",
        JSON.stringify(issuedBooks)
    );

    alert("Book returned successfully!");

    document.getElementById("result").innerText =
        "📚 " + book.name +
        " returned by Student ID: " + studentId;
}
</script>

</body>
</html>
