<!DOCTYPE html>
<html>
<head>
    <title>Return Books</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #263238;
        }

        header {
            background: linear-gradient(135deg, #163b65, #2878bd);
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .container {
            width: 92%;
            max-width: 700px;
            margin: 35px auto;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .card h2 {
            color: #163b65;
            margin-top: 0;
        }

        .description {
            color: #777;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #37474f;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dce5;
            border-radius: 8px;
            font-size: 15px;
            background: white;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2878bd;
            box-shadow: 0 0 0 3px rgba(40,120,189,0.1);
        }

        .return-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #163b65;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .return-btn:hover {
            background: #2878bd;
        }

        #result {
            margin-top: 20px;
            padding: 16px;
            background: #eaf7ee;
            color: #216b3a;
            border-radius: 8px;
            line-height: 1.5;
            font-weight: bold;
            display: block;
        }

        .warning {
            margin-top: 20px;
            padding: 15px;
            background: #fff7e6;
            color: #7a5a00;
            border-radius: 8px;
            font-size: 14px;
        }

        .back {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            margin-top: 20px;
            padding: 13px;
            border-radius: 8px;
            background: #555;
            color: white;
            font-weight: bold;
        }

        .back:hover {
            background: #333;
        }

        @media (max-width: 600px) {

            .container {
                width: 94%;
                margin: 20px auto;
            }

            .card {
                padding: 22px;
            }

            header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>↩️ Return Books</h1>
    <p>Process returned, lost, or damaged books</p>
</header>


<div class="container">

    <div class="card">

        <h2>📚 Return Book</h2>

        <p class="description">
            Enter the student and book details to process the return.
        </p>


        <div class="field">

            <label for="studentId">
                👨‍🎓 Student ID
            </label>

            <input
                type="text"
                id="studentId"
                placeholder="Enter Student ID">

        </div>


        <div class="field">

            <label for="bookId">
                📖 Book ID / ISBN
            </label>

            <input
                type="text"
                id="bookId"
                placeholder="Enter Book ID or ISBN">

        </div>


        <div class="field">

            <label for="returnType">
                📋 Return Type
            </label>

            <select id="returnType">

                <option value="Normal">
                    Normal Return
                </option>

                <option value="Lost">
                    Lost Book
                </option>

                <option value="Damaged">
                    Damaged Book
                </option>

            </select>

        </div>


        <button
            type="button"
            class="return-btn"
            onclick="returnBook()">

            ↩️ Return Book

        </button>


        <p id="result"></p>


        <div class="warning">

            💡 <strong>Important:</strong>
            Lost and damaged books may generate additional fines.
            Normal returned books are added back to available copies.

        </div>


        <a
            class="back"
            href="librarian-dashboard.html">

            ← Back to Librarian Dashboard

        </a>

    </div>

</div>


<script>

function returnBook() {

    let studentId =
        document.getElementById("studentId").value.trim();

    let bookId =
        document.getElementById("bookId").value.trim();

    let returnType =
        document.getElementById("returnType").value;


    if (studentId === "" || bookId === "") {

        alert("Please enter Student ID and Book ID.");

        return;
    }


    let books =
        JSON.parse(localStorage.getItem("books")) || [];


    let book = books.find(function(b) {

        return b.isbn === bookId;

    });


    if (!book) {

        alert("Book not found!");

        return;
    }


    let issuedBooks =
        JSON.parse(localStorage.getItem("issuedBooks")) || [];


    let index =
        issuedBooks.findIndex(function(item) {

            return item.studentId === studentId &&
                   item.bookId === bookId;

        });


    if (index === -1) {

        alert("Issued book record not found!");

        return;
    }


    /* BORROWING HISTORY */

    let borrowingHistory =
        JSON.parse(
            localStorage.getItem("borrowingHistory")
        ) || [];


    borrowingHistory.push({

        studentId: studentId,

        bookId: bookId,

        bookName: book.name,

        issueDate:
            issuedBooks[index].issueDate,

        returnDate:
            new Date()
            .toISOString()
            .split("T")[0]

    });


    localStorage.setItem(
        "borrowingHistory",
        JSON.stringify(borrowingHistory)
    );


    /* FINE CALCULATION */

    let fines =
        JSON.parse(
            localStorage.getItem("fines")
        ) || [];


    let settingsFine =
        Number(
            localStorage.getItem("fine")
        ) || 10;


    let fineAmount = 0;

    let reason = "";


    if (returnType === "Lost") {

        fineAmount =
            settingsFine * 10;

        reason =
            "Lost Book";

    }


    else if (returnType === "Damaged") {

        fineAmount =
            settingsFine * 5;

        reason =
            "Damaged Book";

    }


    else {

        let returnedDate =
            new Date();

        let dueDate =
            new Date(
                issuedBooks[index].dueDate
            );


        if (returnedDate > dueDate) {

            let daysLate =
                Math.ceil(
                    (returnedDate - dueDate) /
                    (1000 * 60 * 60 * 24)
                );


            fineAmount =
                daysLate * settingsFine;

            reason =
                "Late Return";

        }

    }


    /* SAVE FINE */

    if (fineAmount > 0) {

        fines.push({

            studentId: studentId,

            bookId: bookId,

            amount: fineAmount,

            reason: reason,

            status: "Pending",

            paymentDate: ""

        });


        localStorage.setItem(
            "fines",
            JSON.stringify(fines)
        );


        alert(
            "⚠️ " +
            reason +
            "! Fine: ₹" +
            fineAmount
        );

    }


    /* UPDATE BOOK COPIES */

    if (returnType === "Normal") {

        book.copies =
            Number(book.copies) + 1;

    }


    localStorage.setItem(
        "books",
        JSON.stringify(books)
    );


    /* REMOVE ISSUED RECORD */

    issuedBooks.splice(index, 1);


    localStorage.setItem(
        "issuedBooks",
        JSON.stringify(issuedBooks)
    );


    /* SUCCESS MESSAGE */

    let result =
        document.getElementById("result");

    result.innerText =
        "📚 Book " +
        book.name +
        " returned successfully.";


    if (returnType === "Lost") {

        result.innerText +=
            " Status: Lost Book.";

    }

    else if (returnType === "Damaged") {

        result.innerText +=
            " Status: Damaged Book.";

    }

}

</script>

</body>
    </html>
