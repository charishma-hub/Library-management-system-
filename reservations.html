<!DOCTYPE html>
<html>
<head>
    <title>Manage Reservations</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>📖 Manage Reservations</h1>
</header>

<div class="container">

    <h2>Book Reservation</h2>

    <input type="text" id="studentId" placeholder="Student ID">

    <input type="text" id="bookId" placeholder="Book ID / ISBN">

    <input type="date" id="reservationDate">

    <<button type="button" onclick="reserveBook()">Reserve Book</button>

    <h2>Reservation List</h2>

    <table border="1" width="100%">
        <thead>
            <tr>
                <th>Student ID</th>
<th>Queue Position</th>
<th>Book Name</th>
<th>Book ID</th>
            </tr>
        </thead>

        <tbody id="reservationTable">

            <tr>
                <td>CSE001</td>
                <td>123456</td>
                <td>02-09-2026</td>
                <td>Waiting</td>
                <td>
                    <button onclick="this.parentElement.parentElement.remove()">
                        Cancel
                    </button>
                </td>
            </tr>

        </tbody>
    </table>

    <br>

    <button onclick="window.location.href='librarian-dashboard.html'">
        Back to Dashboard
    </button>

</div>

<script>
function reserveBook() {

    let studentId =
        document.getElementById("studentId").value.trim();

    let bookId =
        document.getElementById("bookId").value.trim();

    let reservationDate =
        document.getElementById("reservationDate").value;

    if (studentId === "" ||
        bookId === "" ||
        reservationDate === "") {

        alert("Please fill all fields.");
        return;
    }

    let books =
        JSON.parse(localStorage.getItem("books")) || [];

    let book = books.find(function(b) {
        return b.isbn === bookId;
    });

    if (!book) {
        alert("Book not found!");
        return;
    }

    if (Number(book.copies) > 0) {
        alert("Book is available. You can issue it directly.");
        return;
    }

    let reservations =
        JSON.parse(localStorage.getItem("reservations")) || [];

    let queuePosition =
        reservations.filter(function(r) {
            return r.bookId === bookId &&
                   r.status === "Waiting";
        }).length + 1;

    reservations.push({
        studentId: studentId,
        bookId: bookId,
        bookName: book.name,
        date: reservationDate,
        status: "Waiting",
        queuePosition: queuePosition
    });

    localStorage.setItem(
        "reservations",
        JSON.stringify(reservations)
    );

    alert(
        "Book reserved successfully!\n" +
        "Your queue position is: " +
        queuePosition
    );

    displayReservations();
}

function displayReservations() {

    let reservations =
        JSON.parse(localStorage.getItem("reservations")) || [];

    let table = document.getElementById("reservationTable");

    table.innerHTML = "";

    reservations.forEach(function(reservation, index) {

        let row = table.insertRow();

        row.insertCell(0).innerText = reservation.studentId;
        row.insertCell(1).innerText = reservation.queuePosition;
        row.insertCell(2).innerText = reservation.bookName;
        row.insertCell(3).innerText = reservation.bookId;
        row.insertCell(4).innerText = reservation.date;
        row.insertCell(5).innerText = reservation.status;

        let action = row.insertCell(5);

        let button = document.createElement("button");

        button.innerText = "Cancel";

        button.onclick = function() {
            cancelReservation(index);
        };

        action.appendChild(button);
    });
}

function cancelReservation(index) {

    let reservations =
        JSON.parse(localStorage.getItem("reservations")) || [];

    reservations.splice(index, 1);

    localStorage.setItem(
        "reservations",
        JSON.stringify(reservations)
    );

    displayReservations();

    alert("Reservation cancelled.");
}

displayReservations();
    function checkReservationAvailability() {

    let reservations =
        JSON.parse(localStorage.getItem("reservations")) || [];

    let books =
        JSON.parse(localStorage.getItem("books")) || [];

    reservations.forEach(function(reservation) {

        let book = books.find(function(b) {
            return b.isbn === reservation.bookId;
        });

        if (book && Number(book.copies) > 0 &&
            reservation.status === "Waiting") {

            reservation.status = "📢 Available";

            alert(
                "📢 " + reservation.bookName +
                " is now available for Student ID: " +
                reservation.studentId
            );
        }
    });

    localStorage.setItem(
        "reservations",
        JSON.stringify(reservations)
    );
}

checkReservationAvailability();


</script>

</body>
</html>
