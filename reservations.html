<!DOCTYPE html>
<html>
<head>
    <title>Manage Reservations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: linear-gradient(135deg, #163b65, #2878bd);
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 1150px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: #163b65;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dce5;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2878bd;
        }

        .reserve-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2878bd;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reserve-btn:hover {
            background: #163b65;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #163b65;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f5f9fd;
        }

        .cancel-btn {
            background: #d9534f;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .cancel-btn:hover {
            background: #b52b27;
        }

        .status {
            font-weight: bold;
        }

        .back-btn {
            display: inline-block;
            background: #163b65;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .back-btn:hover {
            background: #2878bd;
        }

        @media (max-width: 700px) {
            header h1 {
                font-size: 24px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 18px;
            }

            .container {
                padding: 0 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📖 Manage Reservations</h1>
    <p>Reserve unavailable books and manage the waiting queue</p>
</header>

<div class="container">

    <!-- RESERVATION FORM -->
    <div class="card">

        <h2>📌 Book Reservation</h2>

        <div class="form-grid">

            <input
                type="text"
                id="studentId"
                placeholder="Student ID">

            <input
                type="text"
                id="bookId"
                placeholder="Book ID / ISBN">

            <input
                type="date"
                id="reservationDate">

        </div>

        <button
            type="button"
            class="reserve-btn"
            onclick="reserveBook()">
            📌 Reserve Book
        </button>

    </div>


    <!-- RESERVATION LIST -->
    <div class="card">

        <h2>📋 Reservation List</h2>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Queue Position</th>
                        <th>Book Name</th>
                        <th>Book ID</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="reservationTable"></tbody>

            </table>

        </div>

    </div>


    <a
        href="librarian-dashboard.html"
        class="back-btn">
        ← Back to Librarian Dashboard
    </a>

</div>


<script>

function reserveBook() {

    let studentId =
        document.getElementById("studentId").value.trim();

    let bookId =
        document.getElementById("bookId").value.trim();

    let reservationDate =
        document.getElementById("reservationDate").value;


    if (
        studentId === "" ||
        bookId === "" ||
        reservationDate === ""
    ) {
        alert("Please fill all fields.");
        return;
    }


    let books =
        JSON.parse(
            localStorage.getItem("books")
        ) || [];


    let book =
        books.find(function(b) {
            return b.isbn === bookId;
        });


    if (!book) {
        alert("Book not found!");
        return;
    }


    if (Number(book.copies) > 0) {

        alert(
            "Book is available. You can issue it directly."
        );

        return;
    }


    let reservations =
        JSON.parse(
            localStorage.getItem("reservations")
        ) || [];


    let queuePosition =
        reservations.filter(function(r) {

            return r.bookId === bookId &&
                   r.status === "Waiting";

        }).length + 1;


    reservations.push({

        studentId: studentId,

        bookId: bookId,

        bookName: book.name,

        date: reservationDate,

        status: "Waiting",

        queuePosition: queuePosition

    });


    localStorage.setItem(
        "reservations",
        JSON.stringify(reservations)
    );


    alert(
        "Book reserved successfully!\n" +
        "Your queue position is: " +
        queuePosition
    );


    document.getElementById("studentId").value = "";
    document.getElementById("bookId").value = "";
    document.getElementById("reservationDate").value = "";


    displayReservations();
}



function displayReservations() {

    let reservations =
        JSON.parse(
            localStorage.getItem("reservations")
        ) || [];


    let table =
        document.getElementById(
            "reservationTable"
        );


    table.innerHTML = "";


    reservations.forEach(function(
        reservation,
        index
    ) {

        let row =
            table.insertRow();


        row.insertCell(0).innerText =
            reservation.studentId;


        row.insertCell(1).innerText =
            reservation.queuePosition;


        row.insertCell(2).innerText =
            reservation.bookName;


        row.insertCell(3).innerText =
            reservation.bookId;


        row.insertCell(4).innerText =
            reservation.date;


        let statusCell =
            row.insertCell(5);

        statusCell.innerText =
            reservation.status;

        statusCell.className =
            "status";


        let action =
            row.insertCell(6);


        let button =
            document.createElement("button");


        button.innerText =
            "Cancel";


        button.className =
            "cancel-btn";


        button.onclick =
            function() {

                cancelReservation(index);

            };


        action.appendChild(button);

    });

}



function cancelReservation(index) {

    let reservations =
        JSON.parse(
            localStorage.getItem("reservations")
        ) || [];


    if (
        !confirm(
            "Are you sure you want to cancel this reservation?"
        )
    ) {
        return;
    }


    reservations.splice(index, 1);


    localStorage.setItem(
        "reservations",
        JSON.stringify(reservations)
    );


    displayReservations();


    alert("Reservation cancelled.");

}



function checkReservationAvailability() {

    let reservations =
        JSON.parse(
            localStorage.getItem("reservations")
        ) || [];


    let books =
        JSON.parse(
            localStorage.getItem("books")
        ) || [];


    reservations.forEach(function(reservation) {

        let book =
            books.find(function(b) {

                return b.isbn ===
                       reservation.bookId;

            });


        if (
            book &&
            Number(book.copies) > 0 &&
            reservation.status === "Waiting"
        ) {

            reservation.status =
                "📢 Available";


            alert(
                "📢 " +
                reservation.bookName +
                " is now available for Student ID: " +
                reservation.studentId
            );

        }

    });


    localStorage.setItem(
        "reservations",
        JSON.stringify(reservations)
    );

}


displayReservations();

checkReservationAvailability();

</script>

</body>
</html>
