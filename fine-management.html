<!DOCTYPE html>
<html>
<head>
    <title>Fine Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>💰 Fine Management</h1>
</header>

<div class="container">

    <h2>Add Fine</h2>

    <input type="text" id="studentId" placeholder="Student ID">

    <input type="text" id="bookId" placeholder="Book ID / ISBN">

    <input type="number" id="amount" placeholder="Fine Amount (₹)">

    <select id="reason">
        <option value="">Select Fine Reason</option>
        <option value="Late Return">Late Return</option>
        <option value="Lost Book">Lost Book</option>
        <option value="Damaged Book">Damaged Book</option>
    </select>

    <button onclick="addFine()">Add Fine</button>

    <h2>Fine Records</h2>

    <table border="1" width="100%">
        <thead>
            <tr>
                <th>Student ID</th>
<th>Book ID</th>
<th>Amount</th>
<th>Reason</th>
<th>Status</th>
<th>Payment Date</th>
<th>Action</th>
            </tr>
        </thead>

        <tbody id="fineTable">

            <tr>
                <td>CSE001</td>
                <td>123456</td>
                <td>₹20</td>
                <td>Late Return</td>
                <td>Pending</td>
                <td>
                    <button onclick="payFine(this)">
                        Mark Paid
                    </button>
                </td>
            </tr>

        </tbody>
    </table>

    <br>

    <button onclick="window.location.href='librarian-dashboard.html'">
        Back to Dashboard
    </button>

</div>

<script>

function addFine() {

    let studentId = document.getElementById("studentId").value.trim();
    let bookId = document.getElementById("bookId").value.trim();
    let amount = document.getElementById("amount").value.trim();
    let reason = document.getElementById("reason").value;

    if (studentId === "" || bookId === "" ||
        amount === "" || reason === "") {

        alert("Please fill all fields.");
        return;
    }

    let fines = JSON.parse(localStorage.getItem("fines")) || [];

    fines.push({
        studentId: studentId,
        bookId: bookId,
        amount: amount,
        reason: reason,
        status: "Pending"
    });

    localStorage.setItem("fines", JSON.stringify(fines));

    alert("Fine added successfully!");

    displayFines();
}


function displayFines() {

    let fines = JSON.parse(localStorage.getItem("fines")) || [];

    let table = document.getElementById("fineTable");

    if (!table) return;

    table.innerHTML = "";

    fines.forEach(function(fine, index) {

        let row = table.insertRow();

        row.insertCell(0).innerText = fine.studentId;
        row.insertCell(1).innerText = fine.bookId;
        row.insertCell(2).innerText = "₹" + fine.amount;
        row.insertCell(3).innerText = fine.reason;
        row.insertCell(4).innerText = fine.status;

        let action = row.insertCell(5);

        if (fine.status === "Pending") {

            let button = document.createElement("button");

            button.innerText = "Mark Paid";

            button.onclick = function() {
                markPaid(index);
            };

            action.appendChild(button);
        }
    });
}


function markPaid(index) {

    let fines = JSON.parse(localStorage.getItem("fines")) || [];

    fines[index].status = "Paid";

    localStorage.setItem("fines", JSON.stringify(fines));

    displayFines();

    alert("Fine marked as paid.");
}


displayFines();

</script>

</body>
</html>
