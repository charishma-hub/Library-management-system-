<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fine Management - Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
        }

        header {
            background: linear-gradient(135deg, #0f4c81, #1976d2);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            padding: 22px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        }

        .summary-card .icon {
            font-size: 28px;
        }

        .summary-card h3 {
            margin: 8px 0;
            color: #64748b;
            font-size: 15px;
        }

        .summary-card .value {
            font-size: 25px;
            font-weight: bold;
            color: #0f4c81;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .card h2 {
            margin-top: 0;
            color: #0f4c81;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1976d2;
        }

        .add-btn {
            margin-top: 18px;
            padding: 13px 24px;
            border: none;
            border-radius: 9px;
            background: #1976d2;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #0f4c81;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #eaf3ff;
            color: #0f4c81;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f8fbff;
        }

        .amount {
            font-weight: bold;
            color: #b91c1c;
        }

        .pending {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #fee2e2;
            color: #b91c1c;
            font-weight: bold;
            font-size: 13px;
        }

        .paid {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-weight: bold;
            font-size: 13px;
        }

        .pay-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 7px;
            background: #16a34a;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .pay-btn:hover {
            background: #15803d;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 25px auto;
            padding: 12px 22px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #0f4c81;
        }

        @media (max-width: 700px) {

            header h1 {
                font-size: 24px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>💰 Fine Management</h1>
    <p>Manage library fines and payment records</p>
</header>

<div class="container">

    <!-- Summary -->
    <div class="summary">

        <div class="summary-card">
            <div class="icon">💰</div>
            <h3>Total Fine</h3>
            <div class="value" id="totalFine">₹0</div>
        </div>

        <div class="summary-card">
            <div class="icon">⏳</div>
            <h3>Pending Fine</h3>
            <div class="value" id="pendingFine">₹0</div>
        </div>

        <div class="summary-card">
            <div class="icon">✅</div>
            <h3>Paid Fine</h3>
            <div class="value" id="paidFine">₹0</div>
        </div>

    </div>


    <!-- Add Fine -->
    <div class="card">

        <h2>➕ Add Fine</h2>

        <div class="form-grid">

            <input
                type="text"
                id="studentId"
                placeholder="Student ID">

            <input
                type="text"
                id="bookId"
                placeholder="Book ID / ISBN">

            <input
                type="number"
                id="amount"
                placeholder="Fine Amount (₹)"
                min="1">

            <select id="reason">
                <option value="">Select Fine Reason</option>
                <option value="Late Return">Late Return</option>
                <option value="Lost Book">Lost Book</option>
                <option value="Damaged Book">Damaged Book</option>
            </select>

        </div>

        <button class="add-btn" onclick="addFine()">
            + Add Fine
        </button>

    </div>


    <!-- Fine Records -->
    <div class="card">

        <h2>📋 Fine Records</h2>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Book ID</th>
                        <th>Amount</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Payment Date</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="fineTable"></tbody>

            </table>

        </div>

        <p id="emptyMessage" class="empty"></p>

    </div>


    <a href="librarian-dashboard.html" class="back-btn">
        ← Back to Librarian Dashboard
    </a>

</div>


<script>

function addFine() {

    let studentId =
        document.getElementById("studentId").value.trim();

    let bookId =
        document.getElementById("bookId").value.trim();

    let amount =
        document.getElementById("amount").value.trim();

    let reason =
        document.getElementById("reason").value;


    if (
        studentId === "" ||
        bookId === "" ||
        amount === "" ||
        reason === ""
    ) {
        alert("Please fill all fields.");
        return;
    }


    if (Number(amount) <= 0) {
        alert("Fine amount must be greater than 0.");
        return;
    }


    let fines =
        JSON.parse(localStorage.getItem("fines")) || [];


    fines.push({

        studentId: studentId,
        bookId: bookId,
        amount: Number(amount),
        reason: reason,
        status: "Pending",
        paymentDate: ""

    });


    localStorage.setItem(
        "fines",
        JSON.stringify(fines)
    );


    document.getElementById("studentId").value = "";
    document.getElementById("bookId").value = "";
    document.getElementById("amount").value = "";
    document.getElementById("reason").value = "";


    displayFines();

    alert("Fine added successfully!");
}


function displayFines() {

    let fines =
        JSON.parse(localStorage.getItem("fines")) || [];

    let table =
        document.getElementById("fineTable");

    let emptyMessage =
        document.getElementById("emptyMessage");

    let totalFine =
        document.getElementById("totalFine");

    let pendingFine =
        document.getElementById("pendingFine");

    let paidFine =
        document.getElementById("paidFine");


    table.innerHTML = "";
    emptyMessage.innerText = "";


    let total = 0;
    let pending = 0;
    let paid = 0;


    if (fines.length === 0) {

        emptyMessage.innerText =
            "No fine records found.";

    }


    fines.forEach(function(fine, index) {

        let amount = Number(fine.amount) || 0;

        total += amount;


        if (
            String(fine.status).toLowerCase() === "paid"
        ) {
            paid += amount;
        } else {
            pending += amount;
        }


        let row = table.insertRow();


        row.insertCell(0).innerText =
            fine.studentId || "-";


        row.insertCell(1).innerText =
            fine.bookId || "-";


        let amountCell = row.insertCell(2);

        amountCell.innerText =
            "₹" + amount;

        amountCell.className =
            "amount";


        row.insertCell(3).innerText =
            fine.reason || "-";


        let statusCell =
            row.insertCell(4);

        let status =
            document.createElement("span");


        if (
            String(fine.status).toLowerCase() === "paid"
        ) {

            status.innerText = "Paid";
            status.className = "paid";

        } else {

            status.innerText = "Pending";
            status.className = "pending";
        }


        statusCell.appendChild(status);


        row.insertCell(5).innerText =
            fine.paymentDate || "-";


        let actionCell =
            row.insertCell(6);


        if (
            String(fine.status).toLowerCase() !== "paid"
        ) {

            let button =
                document.createElement("button");

            button.innerText = "Mark Paid";
            button.className = "pay-btn";

            button.onclick = function() {
                markPaid(index);
            };

            actionCell.appendChild(button);

        } else {

            actionCell.innerText = "✓ Completed";
        }

    });


    totalFine.innerText =
        "₹" + total;

    pendingFine.innerText =
        "₹" + pending;

    paidFine.innerText =
        "₹" + paid;
}


function markPaid(index) {

    let fines =
        JSON.parse(localStorage.getItem("fines")) || [];


    if (!fines[index]) {
        return;
    }


    fines[index].status = "Paid";

    fines[index].paymentDate =
        new Date().toISOString().split("T")[0];


    localStorage.setItem(
        "fines",
        JSON.stringify(fines)
    );


    displayFines();

    alert("Fine marked as paid.");
}


displayFines();

</script>

</body>
</html>
