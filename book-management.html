<!DOCTYPE html>
<html>
<head>
    <title>Book Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>📚 Book Management</h1>
</header>

<div class="container">

    <h2>Add Book</h2>

    <input type="text" id="bookName" placeholder="Book Name">

    <input type="text" id="author" placeholder="Author">

    <input type="text" id="isbn" placeholder="ISBN">

    <input type="text" id="category" placeholder="Category">

    <input type="text" id="publisher" placeholder="Publisher">

    <input type="number" id="copies" placeholder="Number of Copies">

    <button onclick="addBook()">Add Book</button>

    <h2>Book List</h2>

    <table border="1" width="100%">
        <thead>
            <tr>
                <th>Book Name</th>
                <th>Author</th>
                <th>ISBN</th>
                <th>Category</th>
                <th>Publisher</th>
                <th>Copies</th>
                <th>Status</th>
        <th>Action</th>
            </tr>
        </thead>

        <tbody id="bookTable">

            <tr>
                <td>Database Management Systems</td>
                <td>Korth</td>
                <td>123456</td>
                <td>Computer Science</td>
                <td>McGraw Hill</td>
                <td>5</td>
                <td>Available</td>
                <td>
                    
                </td>
            </tr>

        </tbody>
    </table>

    <br>

    <button onclick="window.location.href='librarian-dashboard.html'">
        Back to Dashboard
    </button>

</div>

<script>



function addBook() {

    let name = document.getElementById("bookName").value.trim();
    let author = document.getElementById("author").value.trim();
    let isbn = document.getElementById("isbn").value.trim();
    let category = document.getElementById("category").value.trim();
    let publisher = document.getElementById("publisher").value.trim();
    let copies = document.getElementById("copies").value;

    if (
        name === "" ||
        author === "" ||
        isbn === "" ||
        category === "" ||
        publisher === "" ||
        copies === ""
    ) {
        alert("Please fill all fields.");
        return;
    }

    let table = document.getElementById("bookTable");

    let row = table.insertRow();

    row.insertCell(0).innerHTML = name;
    row.insertCell(1).innerHTML = author;
    row.insertCell(2).innerHTML = isbn;
    row.insertCell(3).innerHTML = category;
    row.insertCell(4).innerHTML = publisher;
    row.insertCell(5).innerHTML = copies;
    row.insertCell(6).innerHTML = "Available";

    row.insertCell(7).innerHTML =
        '<button onclick="updateBook(this)">Update</button> ' +
        '<button onclick="this.parentElement.parentElement.remove()">Delete</button>';

    document.getElementById("bookName").value = "";
    document.getElementById("author").value = "";
    document.getElementById("isbn").value = "";
    document.getElementById("category").value = "";
    document.getElementById("publisher").value = "";
    document.getElementById("copies").value = "";

    alert("Book added successfully!");
}


function updateBook(button) {

    let row = button.parentElement.parentElement;

    let name = prompt("Enter Book Name:", row.cells[0].innerText);
    if (name === null) return;

    let author = prompt("Enter Author:", row.cells[1].innerText);
    if (author === null) return;

    let isbn = prompt("Enter ISBN:", row.cells[2].innerText);
    if (isbn === null) return;

    let category = prompt("Enter Category:", row.cells[3].innerText);
    if (category === null) return;

    let publisher = prompt("Enter Publisher:", row.cells[4].innerText);
    if (publisher === null) return;

    let copies = prompt("Enter Number of Copies:", row.cells[5].innerText);
    if (copies === null) return;

    row.cells[0].innerText = name;
    row.cells[1].innerText = author;
    row.cells[2].innerText = isbn;
    row.cells[3].innerText = category;
    row.cells[4].innerText = publisher;
    row.cells[5].innerText = copies;

    alert("Book updated successfully!");
}

</script>



</body>
  </html>
