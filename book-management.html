<!DOCTYPE html>
<html>
<head>
    <title>Book Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>📚 Book Management</h1>

<div class="card">

    <h2>Add Book</h2>

    <input type="text" id="bookName" placeholder="Book Name">
    <input type="text" id="author" placeholder="Author">
    <input type="text" id="isbn" placeholder="ISBN">
    <input type="text" id="category" placeholder="Category">
    <input type="text" id="publisher" placeholder="Publisher">
    <input type="number" id="copies" placeholder="Number of Copies">

    <button type="button" onclick="addBook()">Add Book</button>

    <p id="message"></p>

</div>

<div class="card">

    <h2>Book List</h2>

    <table border="1" width="100%">
        <thead>
            <tr>
                <th>Book Name</th>
                <th>Author</th>
                <th>ISBN</th>
                <th>Category</th>
                <th>Publisher</th>
                <th>Copies</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="bookTable"></tbody>
    </table>

</div>

<br>

<button type="button"
onclick="window.location.href='librarian-dashboard.html'">
    Back to Librarian Dashboard
</button>


<script>

function addBook() {

    let name = document.getElementById("bookName").value.trim();
    let author = document.getElementById("author").value.trim();
    let isbn = document.getElementById("isbn").value.trim();
    let category = document.getElementById("category").value.trim();
    let publisher = document.getElementById("publisher").value.trim();
    let copies = document.getElementById("copies").value.trim();

    if (name === "" || author === "" || isbn === "" ||
        category === "" || publisher === "" || copies === "") {

        alert("Please fill all fields.");
        return;
    }

    let books = JSON.parse(localStorage.getItem("books")) || [];

    books.push({
        name: name,
        author: author,
        isbn: isbn,
        category: category,
        publisher: publisher,
        totalCopies: Number(copies),
copies: Number(copies)
    });

    localStorage.setItem("books", JSON.stringify(books));

    alert("Book added successfully!");

    document.getElementById("bookName").value = "";
    document.getElementById("author").value = "";
    document.getElementById("isbn").value = "";
    document.getElementById("category").value = "";
    document.getElementById("publisher").value = "";
    document.getElementById("copies").value = "";

    displayBooks();
}


function displayBooks() {

    let books = JSON.parse(localStorage.getItem("books")) || [];

    let table = document.getElementById("bookTable");

    table.innerHTML = "";

    books.forEach(function(book, index) {

        let row = table.insertRow();

        row.insertCell(0).innerText = book.name;
        row.insertCell(1).innerText = book.author;
        row.insertCell(2).innerText = book.isbn;
        row.insertCell(3).innerText = book.category;
        row.insertCell(4).innerText = book.publisher;
        row.insertCell(5).innerText = book.copies;

        let action = row.insertCell(6);

        let button = document.createElement("button");

        button.innerText = "Delete";

        button.onclick = function() {
            deleteBook(index);
        };

        action.appendChild(button);
        let updateButton = document.createElement("button");

updateButton.innerText = "Update";

updateButton.onclick = function() {
    updateBook(index);
};

action.appendChild(updateButton);
    });
}


function deleteBook(index) {

    let books = JSON.parse(localStorage.getItem("books")) || [];

    books.splice(index, 1);

    localStorage.setItem("books", JSON.stringify(books));

    displayBooks();
}


displayBooks();

</script>

</body>
</html>
