<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: linear-gradient(135deg, #163b65, #2878bd);
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .profile-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .profile-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #e8f2fb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .profile-title {
            text-align: center;
            margin-bottom: 28px;
        }

        .profile-title h2 {
            color: #163b65;
            margin: 0 0 8px;
        }

        .profile-title p {
            color: #6b7280;
            margin: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .field {
            margin-bottom: 5px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dce5;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2878bd;
        }

        .save-btn {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2878bd;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #163b65;
        }

        #savedProfile {
            display: none;
            margin-top: 25px;
            padding: 22px;
            border-radius: 12px;
            background: #eef7f1;
            border-left: 5px solid #2e8b57;
        }

        #savedProfile h2 {
            margin-top: 0;
            color: #247a4a;
        }

        #savedProfile p {
            margin: 10px 0;
        }

        .back-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            text-align: center;
            background: #163b65;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back-btn:hover {
            background: #2878bd;
        }

        @media (max-width: 700px) {

            header h1 {
                font-size: 24px;
            }

            .container {
                padding: 0 12px;
            }

            .profile-card {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>👤 Student Profile</h1>
    <p>Manage your library account information</p>
</header>

<div class="container">

    <div class="profile-card">

        <div class="profile-icon">
            👩‍🎓
        </div>

        <div class="profile-title">
            <h2>Student Information</h2>
            <p>Enter and update your personal details</p>
        </div>

        <div class="form-grid">

            <div class="field">
                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name">
            </div>

            <div class="field">
                <label>Student ID</label>
                <input
                    type="text"
                    id="studentId"
                    placeholder="Enter student ID">
            </div>

            <div class="field">
                <label>Course</label>
                <input
                    type="text"
                    id="course"
                    placeholder="Enter course">
            </div>

            <div class="field">
                <label>Year</label>
                <select id="year">
                    <option value="">Select Year</option>
                    <option>1st Year</option>
                    <option>2nd Year</option>
                    <option>3rd Year</option>
                    <option>4th Year</option>
                </select>
            </div>

            <div class="field">
                <label>Department</label>
                <input
                    type="text"
                    id="department"
                    placeholder="Enter department">
            </div>

            <div class="field">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter email">
            </div>

            <div class="field">
                <label>Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number">
            </div>

        </div>

        <button
            class="save-btn"
            onclick="saveProfile()">
            💾 Save Profile
        </button>

        <div id="savedProfile"></div>

        <a
            href="student-dashboard.html"
            class="back-btn">
            ← Back to Student Dashboard
        </a>

    </div>

</div>


<script>

window.onload = function() {

    document.getElementById("name").value =
        localStorage.getItem("studentName") || "";

    document.getElementById("studentId").value =
        localStorage.getItem("studentId") || "";

    document.getElementById("course").value =
        localStorage.getItem("course") || "";

    document.getElementById("year").value =
        localStorage.getItem("year") || "";

    document.getElementById("department").value =
        localStorage.getItem("department") || "";

    document.getElementById("email").value =
        localStorage.getItem("email") || "";

    document.getElementById("phone").value =
        localStorage.getItem("phone") || "";
};


function saveProfile() {

    let name =
        document.getElementById("name").value.trim();

    let studentId =
        document.getElementById("studentId").value.trim();

    let course =
        document.getElementById("course").value.trim();

    let year =
        document.getElementById("year").value;

    let department =
        document.getElementById("department").value.trim();

    let email =
        document.getElementById("email").value.trim();

    let phone =
        document.getElementById("phone").value.trim();


    if (
        name === "" ||
        studentId === "" ||
        course === "" ||
        year === "" ||
        department === "" ||
        email === "" ||
        phone === ""
    ) {
        alert("Please fill all student information.");
        return;
    }


    localStorage.setItem("studentName", name);
    localStorage.setItem("studentId", studentId);
    localStorage.setItem("course", course);
    localStorage.setItem("year", year);
    localStorage.setItem("department", department);
    localStorage.setItem("email", email);
    localStorage.setItem("phone", phone);


    let saved =
        document.getElementById("savedProfile");

    saved.style.display = "block";

    saved.innerHTML =
        "<h2>✅ Profile Saved Successfully</h2>" +
        "<p><b>Name:</b> " + name + "</p>" +
        "<p><b>Student ID:</b> " + studentId + "</p>" +
        "<p><b>Course:</b> " + course + "</p>" +
        "<p><b>Year:</b> " + year + "</p>" +
        "<p><b>Department:</b> " + department + "</p>" +
        "<p><b>Email:</b> " + email + "</p>" +
        "<p><b>Phone:</b> " + phone + "</p>";


    alert("Student profile saved successfully!");

}

</script>

</body>
                </html>
