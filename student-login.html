<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
        }

        header {
            background: #1e3a5f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
        }

        .back {
            background: #555;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Student Login</h1>
</header>

<div class="login-box">

    <h2>Login</h2>

    <input type="text"
           id="username"
           placeholder="Enter Username">

    <input type="password"
           id="password"
           placeholder="Enter Password">

    <button type="button" onclick="studentLogin()">
        Login
    </button>

    <a href="student-registration.html">
        New Student? Register
    </a>

    <button type="button"
            class="back"
            onclick="window.location.href='index.html'">
        Back to Home
    </button>

</div>

<script>

function studentLogin() {

    let username =
        document.getElementById("username").value.trim();

    let password =
        document.getElementById("password").value;

    let savedUsername =
        localStorage.getItem("studentUsername");

    let savedPassword =
        localStorage.getItem("studentPassword");


    if (username === "" || password === "") {

        alert("Please enter username and password.");

        return;
    }


    if (savedUsername === null || savedPassword === null) {

        alert("Please register a student account first.");

        return;
    }


    if (username === savedUsername &&
        password === savedPassword) {

        alert("Login successful!");

        window.location.href =
            "student-dashboard.html";

    } else {

        alert("❌ Invalid username or password!");

    }
}

</script>

</body>
</html>
