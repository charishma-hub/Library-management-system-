    <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
        }

        .header {
            background: linear-gradient(135deg, #123b68, #2878bd);
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .header p {
            opacity: 0.9;
        }

        .container {
            max-width: 450px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.08);
        }

        .login-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: #e8f3ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        .login-title h2 {
            color: #163b65;
            margin-bottom: 7px;
        }

        .login-title p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #334155;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d4dce7;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2878bd;
            box-shadow: 0 0 0 3px rgba(40, 120, 189, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2878bd;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .register-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            padding: 13px;
            border-radius: 9px;
            background: #edf2f7;
            color: #163b65;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link:hover {
            background: #e2eaf2;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 12px;
            padding: 13px;
            border-radius: 9px;
            background: #163b65;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .info {
            margin-top: 20px;
            padding: 14px;
            border-radius: 9px;
            background: #eef6ff;
            color: #45617b;
            font-size: 13px;
            line-height: 1.6;
        }

        @media (max-width: 500px) {

            .header h1 {
                font-size: 23px;
            }

            .login-card {
                padding: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📚 Student Login</h1>
        <p>Access your library account</p>
    </div>


    <div class="container">

        <div class="login-card">

            <div class="login-title">

                <div class="login-icon">
                    🔐
                </div>

                <h2>Welcome Back!</h2>

                <p>
                    Login to access your student dashboard
                </p>

            </div>


            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username">

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password">

            </div>


            <button
                type="button"
                class="login-btn"
                onclick="studentLogin()">

                🔓 Login to Account

            </button>


            <a
                href="student-registration.html"
                class="register-link">

                🧑‍🎓 New Student? Create Account

            </a>


            <a
                href="index.html"
                class="home-link">

                ← Back to Home

            </a>


            <div class="info">
                🔒 Use the username and password created during
                student registration.
            </div>

        </div>

    </div>


<script>

function studentLogin() {

    let username =
        document.getElementById("username")
        .value
        .trim();

    let password =
        document.getElementById("password")
        .value;

    let savedUsername =
        localStorage.getItem("studentUsername");

    let savedPassword =
        localStorage.getItem("studentPassword");


    if (username === "" || password === "") {

        alert(
            "Please enter username and password."
        );

        return;
    }


    if (
        savedUsername === null ||
        savedPassword === null
    ) {

        alert(
            "Please register a student account first."
        );

        return;
    }


    if (
        username === savedUsername &&
        password === savedPassword
    ) {

        alert("Login successful!");

        window.location.href =
            "student-dashboard.html";

    } else {

        alert(
            "❌ Invalid username or password!"
        );

    }
}

</script>

</body>

</html>
