<!DOCTYPE html>
<html>
<head>
<title>Notifications</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🔔 Notifications</h1>

<div class="card">

<h2>📅 Due Date Reminder</h2>

<label>Book Name:</label>
<input type="text" id="bookName" placeholder="Enter book name">

<label>Due Date:</label>
<input type="date" id="dueDate">

<button type="button" onclick="checkDueDate()">
Check Due Date
</button>

<p id="result"></p>

</div>
    <div class="card">

<h2>⚠️ Overdue Check</h2>

<p id="overdue"></p>

</div>

<script>

function checkDueDate() {

    let issuedBooks =
        JSON.parse(localStorage.getItem("issuedBooks")) || [];

    let studentId =
        localStorage.getItem("studentId");

    let result =
        document.getElementById("result");

    if (!studentId) {
        result.innerText =
            "Please register/login as a student first.";
        return;
    }

    let myBooks = issuedBooks.filter(function(book) {
        return book.studentId === studentId;
    });

    if (myBooks.length === 0) {
        result.innerText =
            "No borrowed books found.";
        return;
    }

    let today = new Date();
    let message = "";

    myBooks.forEach(function(book) {

        let due = new Date(book.dueDate);

        if (due < today) {
            message +=
                "⚠️ " + book.bookName +
                " is overdue!<br>";
        } else {
            message +=
                "📚 " + book.bookName +
                " is due on " + book.dueDate +
                "<br>";
        }
    });

    result.innerHTML = message;
}

</script>

<br>

<button onclick="window.location.href='student-dashboard.html'">
Back to Dashboard
</button>

</body>
</html>
