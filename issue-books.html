<!DOCTYPE html>
<html>
<head>
    <title>Issue Books</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #263238;
        }

        header {
            background: linear-gradient(135deg, #163b65, #2878bd);
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .container {
            width: 92%;
            max-width: 700px;
            margin: 35px auto;
        }

        .form-card {
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-card h2 {
            color: #163b65;
            margin-top: 0;
        }

        .form-card > p {
            color: #777;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #37474f;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dce5;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2878bd;
            box-shadow: 0 0 0 3px rgba(40,120,189,0.1);
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .issue-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #163b65;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .issue-btn:hover {
            background: #2878bd;
        }

        #result {
            margin-top: 20px;
            padding: 16px;
            background: #eaf7ee;
            color: #216b3a;
            border-radius: 8px;
            display: none;
            line-height: 1.5;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #eef5ff;
            border-radius: 8px;
            color: #36536d;
            font-size: 14px;
        }

        .back {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            margin-top: 20px;
            padding: 13px;
            border-radius: 8px;
            background: #555;
            color: white;
            font-weight: bold;
        }

        .back:hover {
            background: #333;
        }

        @media (max-width: 600px) {

            .container {
                width: 94%;
                margin: 20px auto;
            }

            .form-card {
                padding: 22px;
            }

            header h1 {
                font-size: 25px;
            }

            .date-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📖 Issue Books</h1>
    <p>Issue a book to a registered student</p>
</header>

<div class="container">

    <div class="form-card">

        <h2>📚 Issue Book to Student</h2>

        <p>
            Enter the student and book details below.
        </p>

        <div class="field">
            <label for="studentId">👨‍🎓 Student ID</label>

            <input
                type="text"
                id="studentId"
                placeholder="Enter Student ID">
        </div>

        <div class="field">
            <label for="bookId">📚 Book ID / ISBN</label>

            <input
                type="text"
                id="bookId"
                placeholder="Enter Book ID or ISBN">
        </div>

        <div class="date-row">

            <div class="field">
                <label for="issueDate">📅 Issue Date</label>

                <input
                    type="date"
                    id="issueDate">
            </div>

            <div class="field">
                <label for="dueDate">⏰ Due Date</label>

                <input
                    type="date"
                    id="dueDate">
            </div>

        </div>

        <button
            class="issue-btn"
            onclick="issueBook()">
            📖 Issue Book
        </button>

        <div id="result"></div>

        <div class="info">
            💡 <strong>Note:</strong>
            Make sure the book is available before issuing it.
        </div>

        <a
            class="back"
            href="librarian-dashboard.html">
            ← Back to Librarian Dashboard
        </a>

    </div>

</div>


<script>

function issueBook() {

    let studentId =
        document.getElementById("studentId").value.trim();

    let bookId =
        document.getElementById("bookId").value.trim();

    let issueDate =
        document.getElementById("issueDate").value;

    let dueDate =
        document.getElementById("dueDate").value;


    if (
        studentId === "" ||
        bookId === "" ||
        issueDate === "" ||
        dueDate === ""
    ) {

        alert("Please fill all fields.");
        return;
    }


    if (new Date(dueDate) <= new Date(issueDate)) {

        alert("Due date must be after issue date.");
        return;
    }


    let books =
        JSON.parse(localStorage.getItem("books")) || [];


    let book = books.find(function(b) {

        return b.isbn === bookId;

    });


    if (!book) {

        alert("Book not found!");
        return;
    }


    if (Number(book.copies) <= 0) {

        alert("Book is not available!");
        return;
    }


    book.copies =
        Number(book.copies) - 1;


    localStorage.setItem(
        "books",
        JSON.stringify(books)
    );


    let issuedBooks =
        JSON.parse(
            localStorage.getItem("issuedBooks")
        ) || [];


    issuedBooks.push({

        studentId: studentId,

        bookId: bookId,

        bookName: book.name,

        issueDate: issueDate,

        dueDate: dueDate

    });


    localStorage.setItem(
        "issuedBooks",
        JSON.stringify(issuedBooks)
    );


    alert("Book issued successfully!");


    let result =
        document.getElementById("result");

    result.style.display = "block";

    result.innerText =
        "📖 " + book.name +
        " issued to Student ID: " +
        studentId +
        ". Due date: " +
        dueDate;
}

</script>

</body>
</html>
