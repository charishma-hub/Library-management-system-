<!DOCTYPE html>
<html>
<head>
    <title>Issue Books</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
        }

        header {
            background: #1e3a5f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            padding: 12px 20px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .back {
            background: #555;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eef5ff;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>📖 Issue Books</h1>
</header>

<div class="container">

    <h2>Issue Book to Student</h2>

    <input type="text" id="studentId"
           placeholder="Enter Student ID">

    <input type="text" id="bookId"
           placeholder="Enter Book ID / ISBN">

    <input type="date" id="issueDate">

    <input type="date" id="dueDate">

    <button onclick="issueBook()">
        Issue Book
    </button>

    <div id="result"></div>

    <br>

    <button class="back"
        onclick="window.location.href='librarian-dashboard.html'">
        Back to Librarian Dashboard
    </button>

</div>

<script>
function issueBook() {

    let studentId = document.getElementById("studentId").value;
    let bookId = document.getElementById("bookId").value;
    let issueDate = document.getElementById("issueDate").value;
    let dueDate = document.getElementById("dueDate").value;

    if (studentId === "" ||
        bookId === "" ||
        issueDate === "" ||
        dueDate === "") {

        alert("Please fill all details.");
        return;
    }

    if (dueDate < issueDate) {
        alert("Due date cannot be before issue date.");
        return;
    }

    let result = document.getElementById("result");

    result.style.display = "block";

    result.innerHTML =
        "<strong>Book Issued Successfully!</strong><br><br>" +
        "Student ID: " + studentId + "<br>" +
        "Book ID / ISBN: " + bookId + "<br>" +
        "Issue Date: " + issueDate + "<br>" +
        "Due Date: " + dueDate;
}
</script>

</body>
</html>
