<!DOCTYPE html>
<html>
<head>
    <title>Manage Students</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
        }

        header {
            background: #1e3a5f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 200px;
        }

        button {
            padding: 10px 18px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #1e3a5f;
            color: white;
        }

        .back {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Manage Students</h1>
</header>

<div class="container">

    <h2>Add Student</h2>

    <input type="text" id="name" placeholder="Student Name">
    <input type="text" id="roll" placeholder="Roll Number">
    <input type="email" id="email" placeholder="Email">

    <button onclick="addStudent()">Add Student</button>

    <h2>Student List</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Roll Number</th>
            <th>Email</th>
        </tr>

        <tbody id="studentList">
            <tr>
                <td>Charan Kumar</td>
                <td>CSE001</td>
                <td>charan@gmail.com</td>
            </tr>
        </tbody>
    </table>

    <button class="back"
        onclick="window.location.href='admin-dashboard.html'">
        Back to Admin Dashboard
    </button>

</div>

<script>
function addStudent() {

    let name = document.getElementById("name").value;
    let roll = document.getElementById("roll").value;
    let email = document.getElementById("email").value;

    if (name === "" || roll === "" || email === "") {
        alert("Please enter all details.");
        return;
    }

    let table = document.getElementById("studentList");

    let row = table.insertRow();

    row.insertCell(0).innerHTML = name;
    row.insertCell(1).innerHTML = roll;
    row.insertCell(2).innerHTML = email;

    document.getElementById("name").value = "";
    document.getElementById("roll").value = "";
    document.getElementById("email").value = "";

    alert("Student added successfully!");
}
</script>

</body>
</html>
