<!DOCTYPE html>
<html>
<head>
    <title>Book Availability</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
        }

        header {
            background: #1e3a5f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #1e3a5f;
            color: white;
        }

        .available {
            color: green;
            font-weight: bold;
        }

        .issued {
            color: red;
            font-weight: bold;
        }

        button {
            padding: 12px 20px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Book Availability</h1>
    <input type="text" id="searchBox"
placeholder="Search by book name, author, ISBN..."
onkeyup="searchBooks()">
</header>

<div class="container">

    <h2>Available Books</h2>

    <table>

        <tr>
            <th>Book Name</th>
            <th>Author</th>
            <th>ISBN</th>
            <th>Status</th>
        </tr>
        <tbody id="bookTable"></tbody>

        

    </table>

    <button onclick="window.location.href='student-dashboard.html'">
        Back to Student Dashboard
    </button>

</div>
<script>
function loadBooks() {

    let books = JSON.parse(localStorage.getItem("books")) || [];

    let table = document.getElementById("bookTable");

    table.innerHTML = "";

    books.forEach(function(book) {

        let row = table.insertRow();

        row.insertCell(0).innerText = book.name;
        row.insertCell(1).innerText = book.author;
        row.insertCell(2).innerText = book.isbn;

        let status = book.copies > 0
            ? "Available"
            : "Issued";

        row.insertCell(3).innerText = status;
    });
}

loadBooks();
</script>
</body>
</html>
