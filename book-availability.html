<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Availability | Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8fc;
            color: #1f2937;
        }

        /* HEADER */

        header {
            background: linear-gradient(135deg, #0d2b4d, #1976d2);
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 10px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        /* CONTAINER */

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
        }

        /* CARD */

        .card {
            background: white;
            padding: 28px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }

        .card h2 {
            color: #12395b;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* SEARCH */

        .search-row {
            display: flex;
            gap: 12px;
        }

        .search-row input {
            flex: 1;
            padding: 15px;
            border: 1px solid #d5dce5;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .search-row input:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
        }

        .search-btn,
        .all-btn {
            padding: 14px 22px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-btn {
            background: #1976d2;
            color: white;
        }

        .all-btn {
            background: #e3f2fd;
            color: #1565c0;
        }

        .search-btn:hover {
            background: #1565c0;
        }

        .all-btn:hover {
            background: #d2e9fb;
        }

        /* TABLE */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #12395b;
            color: white;
            padding: 15px;
            text-align: left;
            font-size: 13px;
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f5f9ff;
        }

        .available {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #dcfce7;
            color: #15803d;
            font-size: 12px;
            font-weight: bold;
        }

        .issued {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #fee2e2;
            color: #dc2626;
            font-size: 12px;
            font-weight: bold;
        }

        #noBooks {
            text-align: center;
            color: #dc2626;
            font-weight: bold;
            margin: 20px 0 0;
        }

        /* BACK */

        .back {
            display: inline-block;
            padding: 13px 22px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: bold;
        }

        .back:hover {
            background: #1565c0;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            header h1 {
                font-size: 25px;
            }

            .container {
                padding: 25px 15px;
            }

            .card {
                padding: 20px;
            }

            .search-row {
                flex-direction: column;
            }

            .search-btn,
            .all-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>📚 Book Availability</h1>

    <p>
        Check book copies and availability instantly
    </p>

</header>


<div class="container">

    <!-- SEARCH CARD -->

    <div class="card">

        <h2>🔍 Search Books</h2>

        <div class="search-row">

            <input
                type="text"
                id="searchBox"
                placeholder="Search by name, author, ISBN, category or publisher"
                onkeyup="searchBooks()"
            >

            <button
                class="search-btn"
                type="button"
                onclick="searchBooks()">
                🔍 Search
            </button>

            <button
                class="all-btn"
                type="button"
                onclick="showAllBooks()">
                Show All
            </button>

        </div>

    </div>


    <!-- BOOK TABLE -->

    <div class="card">

        <h2>📖 Library Books</h2>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>Book Name</th>
                        <th>Author</th>
                        <th>ISBN</th>
                        <th>Category</th>
                        <th>Publisher</th>
                        <th>Copies</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody id="bookTable"></tbody>

            </table>

        </div>

        <p id="noBooks"></p>

    </div>


    <a
        class="back"
        href="student-dashboard.html">
        ← Back to Student Dashboard
    </a>

</div>


<script>

function loadBooks() {

    let books =
        JSON.parse(localStorage.getItem("books")) || [];

    let table =
        document.getElementById("bookTable");

    table.innerHTML = "";

    if (books.length === 0) {

        document.getElementById("noBooks").innerText =
            "📚 No books available in the library.";

        return;
    }

    books.forEach(function(book) {

        let row = table.insertRow();

        row.insertCell(0).innerText =
            book.name || "N/A";

        row.insertCell(1).innerText =
            book.author || "N/A";

        row.insertCell(2).innerText =
            book.isbn || "N/A";

        row.insertCell(3).innerText =
            book.category || "N/A";

        row.insertCell(4).innerText =
            book.publisher || "N/A";

        row.insertCell(5).innerText =
            Number(book.copies) || 0;

        let status =
            Number(book.copies) > 0
                ? "Available"
                : "Issued";

        let statusCell =
            row.insertCell(6);

        let badge =
            document.createElement("span");

        badge.innerText = status;

        badge.className =
            Number(book.copies) > 0
                ? "available"
                : "issued";

        statusCell.appendChild(badge);

    });

}


function searchBooks() {

    let search =
        document
        .getElementById("searchBox")
        .value
        .trim()
        .toLowerCase();

    let rows =
        document.querySelectorAll("#bookTable tr");

    let found = false;

    rows.forEach(function(row) {

        let text =
            row.innerText.toLowerCase();

        if (text.includes(search)) {

            row.style.display = "";

            found = true;

        } else {

            row.style.display = "none";

        }

    });

    document.getElementById("noBooks").innerText =
        found
            ? ""
            : "❌ No books found.";

}


function showAllBooks() {

    document.getElementById("searchBox").value = "";

    let rows =
        document.querySelectorAll("#bookTable tr");

    rows.forEach(function(row) {

        row.style.display = "";

    });

    document.getElementById("noBooks").innerText = "";

}


loadBooks();

</script>

</body>

    </html>
