<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode & QR Code | Library Management System</title>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
        }

        .header {
            background: linear-gradient(135deg, #123b68, #2878bd);
            color: white;
            padding: 25px 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .header p {
            opacity: 0.9;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            color: #163b65;
            margin-bottom: 20px;
            font-size: 21px;
        }

        .label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d4dce7;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2878bd;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            background: #2878bd;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .secondary {
            background: #163b65;
        }

        #qrcode {
            margin: 25px auto 10px;
            width: 180px;
            min-height: 20px;
            display: flex;
            justify-content: center;
        }

        #result {
            text-align: center;
            color: #16803c;
            font-weight: bold;
            margin-top: 15px;
        }

        .book-info {
            line-height: 1.8;
        }

        .book-info h3 {
            color: #2878bd;
            margin-bottom: 12px;
        }

        .status {
            display: inline-block;
            margin-top: 8px;
            padding: 7px 12px;
            border-radius: 20px;
            background: #e8f7ee;
            color: #16803c;
            font-weight: bold;
        }

        .info-box {
            margin-top: 25px;
            background: #eef6ff;
            padding: 15px;
            border-radius: 10px;
            color: #31506d;
            line-height: 1.6;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            background: #163b65;
            color: white;
            padding: 12px 20px;
            border-radius: 9px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 23px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🔳 Barcode & QR Code</h1>
        <p>Generate QR codes and quickly search library books</p>
    </div>

    <div class="container">

        <div class="grid">

            <!-- QR GENERATOR -->
            <div class="card">

                <h2>📚 Generate Book QR Code</h2>

                <label class="label">
                    Book ID / ISBN
                </label>

                <input
                    type="text"
                    id="bookId"
                    placeholder="Enter Book ID or ISBN">

                <div class="buttons">

                    <button type="button" onclick="generateQR()">
                        🔳 Generate QR
                    </button>

                    <button
                        type="button"
                        class="secondary"
                        onclick="scanBook()">
                        🔍 Search Book
                    </button>

                </div>

                <div id="qrcode"></div>

                <p id="result"></p>

                <div class="info-box">
                    💡 Enter the ISBN of a book to generate a QR code.
                    The QR code can be used to identify the book quickly.
                </div>

            </div>


            <!-- BOOK INFORMATION -->
            <div class="card">

                <h2>📖 Book Information</h2>

                <div id="bookInfo" class="book-info">

                    <p>
                        Enter a Book ID / ISBN and click
                        <b>Search Book</b>.
                    </p>

                </div>

            </div>

        </div>


        <a
            href="librarian-dashboard.html"
            class="back">
            ← Back to Librarian Dashboard
        </a>

    </div>


<script>

function generateQR() {

    let bookId =
        document.getElementById("bookId")
        .value
        .trim();

    let qr =
        document.getElementById("qrcode");

    qr.innerHTML = "";

    document.getElementById("result").innerText = "";

    if (bookId === "") {

        alert("Please enter Book ID / ISBN.");

        return;
    }

    new QRCode(qr, {

        text: bookId,

        width: 180,

        height: 180

    });

    document.getElementById("result").innerText =
        "✅ QR Code generated for: " + bookId;
}


function scanBook() {

    let bookId =
        document.getElementById("bookId")
        .value
        .trim();

    if (bookId === "") {

        alert("Please enter Book ID / ISBN.");

        return;
    }

    let books =
        JSON.parse(localStorage.getItem("books")) || [];


    let book =
        books.find(function(b) {

            return String(b.isbn) === String(bookId);

        });


    let bookInfo =
        document.getElementById("bookInfo");


    if (!book) {

        bookInfo.innerHTML =

            "<p style='color:#d32f2f;font-weight:bold;'>" +
            "❌ Book not found!" +
            "</p>";

        return;
    }


    let available =
        Number(book.copies) > 0;


    bookInfo.innerHTML =

        "<h3>📚 " + book.name + "</h3>" +

        "<p><b>Author:</b> " +
        book.author +
        "</p>" +

        "<p><b>ISBN:</b> " +
        book.isbn +
        "</p>" +

        "<p><b>Category:</b> " +
        book.category +
        "</p>" +

        "<p><b>Publisher:</b> " +
        book.publisher +
        "</p>" +

        "<p><b>Available Copies:</b> " +
        book.copies +
        "</p>" +

        "<div class='status'>" +

        (available
            ? "✅ Available"
            : "❌ Currently Issued") +

        "</div>";

}

</script>

</body>

</html>
