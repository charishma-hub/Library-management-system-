<!DOCTYPE html>
<html>
<head>
    <title>Manage Librarians</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
        }

        header {
            background: #1e3a5f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 200px;
        }

        button {
            padding: 10px 18px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #1e3a5f;
            color: white;
        }

        .back {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Manage Librarians</h1>
</header>

<div class="container">

    <h2>Add Librarian</h2>

    <input type="text" id="name" placeholder="Librarian Name">
    <input type="email" id="email" placeholder="Email">
    <input type="text" id="phone" placeholder="Phone">

    <button onclick="addLibrarian()">Add Librarian</button>

    <h2>Librarian List</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
        </tr>

        <tbody id="librarianList">
            <tr>
                <td>Ravi Kumar</td>
                <td>ravi@gmail.com</td>
                <td>9876543210</td>
            </tr>
        </tbody>
    </table>

    <button class="back" onclick="window.location.href='admin-dashboard.html'">
        Back to Admin Dashboard
    </button>

</div>

<script>
function addLibrarian() {

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;

    if (name === "" || email === "" || phone === "") {
        alert("Please enter all details.");
        return;
    }

    let table = document.getElementById("librarianList");

    let row = table.insertRow();

    row.insertCell(0).innerHTML = name;
    row.insertCell(1).innerHTML = email;
    row.insertCell(2).innerHTML = phone;

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("phone").value = "";

    alert("Librarian added successfully!");
}
</script>

</body>
</html>
