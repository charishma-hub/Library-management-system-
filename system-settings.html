   <!DOCTYPE html>
<html>
<head>
<title>System Settings</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>⚙️ System Settings</h1>

<div class="card">

<label>Library Name</label>
<input type="text" id="libraryName"
value="My Library">

<label>Maximum Books a Student Can Borrow</label>
<input type="number" id="maxBooks"
value="3">

<label>Fine Per Day (₹)</label>
<input type="number" id="fine"
value="10">

<label>Library Status</label>
<select id="status">
<option value="Open">Open</option>
<option value="Closed">Closed</option>
</select>

<br><br>

<button type="button" onclick="saveSettings()">
Save Settings
</button>

<p id="message"></p>

</div>

<script>

function saveSettings() {

localStorage.setItem(
"libraryName",
document.getElementById("libraryName").value
);

localStorage.setItem(
"maxBooks",
document.getElementById("maxBooks").value
);

localStorage.setItem(
"fine",
document.getElementById("fine").value
);

localStorage.setItem(
"libraryStatus",
document.getElementById("status").value
);

document.getElementById("message").innerText =
"✅ Settings saved successfully!";

}

</script>

<br>

<button onclick="window.location.href='admin-dashboard.html'">
Back to Admin Dashboard
</button>

</body>
</html>
