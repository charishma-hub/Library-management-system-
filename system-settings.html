<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
        }

        header {
            background: linear-gradient(135deg, #0f2f55, #2563eb);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        header p {
            margin: 0;
            opacity: 0.9;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(15, 47, 85, 0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #0f2f55;
        }

        .setting {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #334155;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            color: #15803d;
            font-weight: bold;
            margin-top: 18px;
            min-height: 20px;
        }

        .info-box {
            margin-top: 25px;
            padding: 15px;
            background: #eff6ff;
            border-left: 4px solid #2563eb;
            border-radius: 8px;
            color: #334155;
            font-size: 14px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            background: #0f2f55;
            color: white;
            padding: 13px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #1e40af;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 24px;
            }

            .card {
                padding: 20px;
            }

            .container {
                width: 94%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>⚙️ System Settings</h1>
    <p>Configure your library system</p>
</header>

<div class="container">

    <div class="card">

        <h2>🔧 Library Configuration</h2>

        <div class="setting">
            <label for="libraryName">Library Name</label>
            <input
                type="text"
                id="libraryName"
                value="My Library"
                placeholder="Enter library name">
        </div>

        <div class="setting">
            <label for="maxBooks">
                Maximum Books a Student Can Borrow
            </label>

            <input
                type="number"
                id="maxBooks"
                value="3"
                min="1"
                placeholder="Enter maximum books">
        </div>

        <div class="setting">
            <label for="fine">Fine Per Day (₹)</label>

            <input
                type="number"
                id="fine"
                value="10"
                min="0"
                placeholder="Enter fine amount">
        </div>

        <div class="setting">
            <label for="status">Library Status</label>

            <select id="status">
                <option value="Open">🟢 Open</option>
                <option value="Closed">🔴 Closed</option>
            </select>
        </div>

        <button class="save-btn" onclick="saveSettings()">
            💾 Save Settings
        </button>

        <p id="message"></p>

        <div class="info-box">
            <strong>ℹ️ Note:</strong>
            These settings are stored in your browser and are used by
            the library management system for borrowing limits and fine
            calculations.
        </div>

    </div>

    <a class="back-btn" href="admin-dashboard.html">
        ← Back to Admin Dashboard
    </a>

</div>

<script>

function loadSettings() {

    let libraryName =
        localStorage.getItem("libraryName");

    let maxBooks =
        localStorage.getItem("maxBooks");

    let fine =
        localStorage.getItem("fine");

    let status =
        localStorage.getItem("libraryStatus");


    if (libraryName !== null) {
        document.getElementById("libraryName").value =
            libraryName;
    }

    if (maxBooks !== null) {
        document.getElementById("maxBooks").value =
            maxBooks;
    }

    if (fine !== null) {
        document.getElementById("fine").value =
            fine;
    }

    if (status !== null) {
        document.getElementById("status").value =
            status;
    }
}


function saveSettings() {

    let libraryName =
        document.getElementById("libraryName").value.trim();

    let maxBooks =
        document.getElementById("maxBooks").value;

    let fine =
        document.getElementById("fine").value;

    let status =
        document.getElementById("status").value;


    if (libraryName === "" ||
        maxBooks === "" ||
        fine === "") {

        alert("Please fill all settings.");
        return;
    }


    if (Number(maxBooks) < 1) {
        alert("Maximum books must be at least 1.");
        return;
    }


    if (Number(fine) < 0) {
        alert("Fine cannot be negative.");
        return;
    }


    localStorage.setItem(
        "libraryName",
        libraryName
    );

    localStorage.setItem(
        "maxBooks",
        maxBooks
    );

    localStorage.setItem(
        "fine",
        fine
    );

    localStorage.setItem(
        "libraryStatus",
        status
    );


    document.getElementById("message").innerText =
        "✅ Settings saved successfully!";

}


window.onload = loadSettings;

</script>

</body>
</html>
