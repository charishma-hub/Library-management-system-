<!DOCTYPE html>
<html>
<head>
    <title>AI Recommendations</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🤖 AI Book Recommendations</h1>

<div class="card">

    <h2>Personalized Book Recommendations</h2>

    <input type="text"
           id="interest"
           placeholder="Enter interest e.g. Java">

    <br><br>

    <button type="button" id="recommendButton">
        🤖 Get Recommendations
    </button>

    <br><br>

    <div id="recommendationResult">
        Enter an interest and click the button.
    </div>

</div>

<br>

<button type="button"
        onclick="window.location.href='student-dashboard.html'">
    Back to Student Dashboard
</button>


<script>

document.getElementById("recommendButton")
    .addEventListener("click", function() {

    let interest =
        document.getElementById("interest")
        .value
        .trim()
        .toLowerCase();

    let result =
        document.getElementById("recommendationResult");

    let books =
        JSON.parse(localStorage.getItem("books")) || [];


    if (books.length === 0) {

        result.innerHTML =
            "❌ No books are available in the library.<br><br>" +
            "Please add books from Book Management.";

        return;
    }


    let matches = books.filter(function(book) {

        let bookText =
            String(book.name || "") + " " +
            String(book.author || "") + " " +
            String(book.category || "") + " " +
            String(book.publisher || "");

        return interest === "" ||
               bookText.toLowerCase().includes(interest);

    });


    if (matches.length === 0) {

        matches = books;

    }


    let output =
        "<h3>🤖 Recommended Books</h3>";


    matches.slice(0, 5).forEach(function(book) {

        output +=
            "<p>" +
            "📚 <b>" + book.name + "</b><br>" +
            "Author: " + book.author + "<br>" +
            "Category: " + book.category + "<br>" +
            "Available Copies: " + book.copies +
            "</p>";

    });


    result.innerHTML = output;

});

</script>

</body>
</html>
