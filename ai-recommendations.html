<!DOCTYPE html>
<html>

<head>
    <title>AI Recommendations</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🤖 AI Book Recommendations</h1>

<div class="card">

    <h2>Get Book Recommendations</h2>

    <p>Enter your interest:</p>

    <input type="text"
           id="interest"
           placeholder="Example: Java, Database, Networks">

    <br><br>

    <button type="button" onclick="getRecommendations()">
        🤖 Get Recommendations
    </button>

    <br><br>

    <div id="result"></div>

</div>

<br>

<button type="button"
        onclick="window.location.href='student-dashboard.html'">
    Back to Student Dashboard
</button>


<script>

function getRecommendations() {

    let interest =
        document.getElementById("interest")
        .value
        .trim()
        .toLowerCase();

    let books =
        JSON.parse(localStorage.getItem("books")) || [];

    let result =
        document.getElementById("result");


    /* If no books are added */

    if (books.length === 0) {

        result.innerHTML =
            "❌ No books found in the library.<br>" +
            "Please add books from Book Management.";

        return;
    }


    /* Find books based on interest */

    let recommendations =
        books.filter(function(book) {

            let text =
                (
                    book.name + " " +
                    book.author + " " +
                    book.category + " " +
                    book.publisher
                ).toLowerCase();

            return interest === "" ||
                   text.includes(interest);

        });


    /* If interest doesn't match */

    if (recommendations.length === 0) {

        recommendations = books;

    }


    let output =
        "🤖 Recommended Books:<br><br>";


    recommendations
        .slice(0, 5)
        .forEach(function(book) {

            output +=
                "📚 <b>" +
                book.name +
                "</b><br>" +

                "Author: " +
                book.author +
                "<br>" +

                "Category: " +
                book.category +
                "<br>" +

                "Available Copies: " +
                book.copies +
                "<br><br>";

        });


    result.innerHTML = output;

}

</script>

</body>

</html>
