<!DOCTYPE html>
<html>

<head>
    <title>AI Recommendations</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🤖 AI Book Recommendations</h1>

<div class="card">

    <h2>Personalized Recommendations</h2>

    <p>
        Get book recommendations based on your
        previous borrowing history.
    </p>

    <button type="button"
            onclick="getRecommendations()">
        Get Recommendations
    </button>

    <br><br>

    <div id="result"></div>

</div>

<br>

<button type="button"
        onclick="window.location.href='student-dashboard.html'">
    Back to Student Dashboard
</button>


<script>

function getRecommendations() {

    let studentId =
        localStorage.getItem("studentId");

    let history =
        JSON.parse(
            localStorage.getItem("borrowingHistory")
        ) || [];

    let books =
        JSON.parse(
            localStorage.getItem("books")
        ) || [];

    let result =
        document.getElementById("result");


    if (!studentId) {

        result.innerText =
            "Please register/login as a student first.";

        return;
    }


    let myHistory =
        history.filter(function(book) {

            return book.studentId === studentId;

        });


    if (myHistory.length === 0) {

        result.innerText =
            "No borrowing history yet. Try borrowing a book first.";

        return;
    }


    let borrowedNames =
        myHistory.map(function(book) {

            return book.bookName;

        });


    let recommendations =
        books.filter(function(book) {

            return !borrowedNames.includes(book.name);

        });


    if (recommendations.length === 0) {

        result.innerText =
            "No new books available for recommendation.";

        return;
    }


    let output =
        "🤖 Recommended Books:<br><br>";


    recommendations
        .slice(0, 5)
        .forEach(function(book) {

            output +=
                "📚 " +
                book.name +
                " — " +
                book.author +
                "<br>";

        });


    result.innerHTML = output;

}

</script>

</body>

</html>
