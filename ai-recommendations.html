<!DOCTYPE html>
<html>
<head>
<title>AI Book Recommendations</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🤖 AI Book Recommendations</h1>

<div class="card">

<h2>Find Books For You</h2>

<input type="text" id="interest"
placeholder="Enter your interest">

<button type="button" onclick="recommendBooks()">
Get Recommendations
</button>

<p id="result"></p>

</div>

<script>

function recommendBooks() {

let interest =
document.getElementById("interest").value.toLowerCase();

let result =
document.getElementById("result");

if (interest === "") {
alert("Please enter your interest");
return;
}

if (interest.includes("java")) {

result.innerText =
"Recommended: Java Programming";

} else if (interest.includes("database") ||
           interest.includes("dbms")) {

result.innerText =
"Recommended: Database Management Systems";

} else if (interest.includes("network")) {

result.innerText =
"Recommended: Computer Networks";

} else {

result.innerText =
"Recommended: Operating System Concepts";

}

}

</script>

<br>

<button onclick="window.location.href='student-dashboard.html'">
Back to Student Dashboard
</button>

</body>
</html>
