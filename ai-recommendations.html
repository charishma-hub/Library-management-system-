<!DOCTYPE html>
<html>

<head>
    <title>AI Recommendations</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🤖 AI Book Recommendations</h1>

<div class="card">

    <h2>Personalized Recommendations</h2>

    <input type="text"
           id="interest"
           placeholder="Enter your interest e.g. Java">

    <br><br>

    <button type="button"
            onclick="getRecommendations()">
        🤖 Get Recommendations
    </button>

</div>


<div class="card">

    <h2>📚 Recommended Books</h2>

    <div id="result">
        Enter your interest and click
        <b>Get Recommendations</b>.
    </div>

</div>


<br>

<button type="button"
        onclick="window.location.href='student-dashboard.html'">
    Back to Student Dashboard
</button>


<script>

function getRecommendations() {

    let interest =
        document.getElementById("interest")
        .value
        .trim()
        .toLowerCase();

    let studentId =
        localStorage.getItem("studentId");

    let books =
        JSON.parse(localStorage.getItem("books")) || [];

    let history =
        JSON.parse(
            localStorage.getItem("borrowingHistory")
        ) || [];

    let result =
        document.getElementById("result");


    if (books.length === 0) {

        result.innerHTML =
            "❌ No books available in the library.";

        return;
    }


    /* Student's borrowing history */

    let myHistory =
        history.filter(function(book) {

            return book.studentId === studentId;

        });


    /* Create interest list */

    let interests = [];

    if (interest !== "") {
        interests.push(interest);
    }


    myHistory.forEach(function(book) {

        if (book.bookName) {

            interests.push(
                book.bookName.toLowerCase()
            );

        }

    });


    /* Find matching books */

    let recommendations =
        books.filter(function(book) {

            let text =
                String(book.name || "") + " " +
                String(book.author || "") + " " +
                String(book.category || "") + " " +
                String(book.publisher || "");

            text = text.toLowerCase();

            return interests.some(function(item) {

                return text.includes(item);

            });

        });


    /* If no match, show available books */

    if (recommendations.length === 0) {

        recommendations =
            books.filter(function(book) {

                return Number(book.copies) > 0;

            });

    }


    if (recommendations.length === 0) {

        result.innerHTML =
            "❌ No recommendations available.";

        return;
    }


    let output = "";


    recommendations
        .slice(0, 5)
        .forEach(function(book) {

            output +=

                "<div class='card'>" +

                "<h3>📖 " +
                book.name +
                "</h3>" +

                "<p>Author: " +
                book.author +
                "</p>" +

                "<p>Category: " +
                book.category +
                "</p>" +

                "<p>Available Copies: " +
                book.copies +
                "</p>" +

                "<p>🤖 Recommended based on your interests/history.</p>" +

                "</div>";

        });


    result.innerHTML = output;

}

</script>

</body>

</html>
