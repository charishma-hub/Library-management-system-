<!DOCTYPE html>
<html>
<head>
    <title>Librarian Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
        }

        header {
            background: #1e3a5f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .back {
            background: #555;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Librarian Login</h1>
</header>

<div class="login-box">

    <h2>Login</h2>

    <input type="text" id="username" placeholder="Username">

    <input type="password" id="password" placeholder="Password">

    <button onclick="librarianLogin()">Login</button>

    <button class="back"
        onclick="window.location.href='index.html'">
        Back to Home
    </button>

</div>

<script>


function librarianLogin() {

let username = document.getElementById("username").value;
let password = document.getElementById("password").value;

if (username === "librarian" && password === "lib123") {

alert("Login successful!");
window.location.href = "librarian-dashboard.html";

} else {

alert("❌ Invalid username or password!");

}

}

</script>


</body>
</html>
