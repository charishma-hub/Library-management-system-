<!DOCTYPE html>
<html>
<head>
    <title>Admin Reports</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>📊 Admin Reports & Dashboard</h1>

<div class="card">

    <h2>Library Statistics</h2>

    <label>Total Books</label>
    <input type="number" id="totalBooks" value="500">

    <label>Available Books</label>
    <input type="number" id="available" value="350">

    <label>Issued Books</label>
    <input type="number" id="issued" value="150">

    <label>Active Students</label>
    <input type="number" id="students" value="250">

    <label>Overdue Books</label>
    <input type="number" id="overdue" value="20">

    <label>Total Fines (₹)</label>
    <input type="number" id="fines" value="2500">

    <br><br>

    <button type="button" onclick="showReport()">
        Update Report
    </button>

</div>

<div class="card">

    <h2>📈 Current Report</h2>

    <div id="report"></div>
    <h3>📚 Most Borrowed Books</h3>
<div id="mostBorrowed"></div>
    <h3>👥 Active Members</h3>
<div id="activeMembers"></div>

</div>

<br>

<button type="button"
onclick="window.location.href='admin-dashboard.html'">
    Back to Admin Dashboard
</button>


<script>

function showReport() {

    let books = JSON.parse(localStorage.getItem("books")) || [];
    let students = JSON.parse(localStorage.getItem("students")) || [];
    let issuedBooks = JSON.parse(localStorage.getItem("issuedBooks")) || [];
    let fines = JSON.parse(localStorage.getItem("fines")) || [];

    let totalBooks = 0;
    let availableBooks = 0;
    let totalFines = 0;
    let overdueBooks = 0;

    books.forEach(function(book) {
        totalBooks += Number(book.totalCopies || book.copies);
        availableBooks += Number(book.copies);
    });

    let today = new Date();

    issuedBooks.forEach(function(book) {

        if (book.dueDate) {

            let dueDate = new Date(book.dueDate);

            if (dueDate < today) {
                overdueBooks++;
            }
        }
    });

    fines.forEach(function(fine) {
        totalFines += Number(fine.amount);
    });

    document.getElementById("totalBooks").value = totalBooks;
    document.getElementById("available").value = availableBooks;
    document.getElementById("issued").value = issuedBooks.length;
    document.getElementById("students").value = students.length;
    document.getElementById("overdue").value = overdueBooks;
    document.getElementById("fines").value = totalFines;

    document.getElementById("report").innerHTML =
        "📚 Total Books: " + totalBooks +
        "<br>✅ Available Books: " + availableBooks +
        "<br>📖 Issued Books: " + issuedBooks.length +
        "<br>👨‍🎓 Active Students: " + students.length +
        "<br>⚠️ Overdue Books: " + overdueBooks +
        "<br>💰 Total Fines: ₹" + totalFines;
    let borrowCount = {};

issuedBooks.forEach(function(book) {
    if (borrowCount[book.bookName]) {
        borrowCount[book.bookName]++;
    } else {
        borrowCount[book.bookName] = 1;
    }
});

let mostBorrowed = "";

for (let bookName in borrowCount) {
    mostBorrowed +=
        "📖 " + bookName +
        " — Borrowed " + borrowCount[bookName] + " time(s)<br>";
}

document.getElementById("mostBorrowed").innerHTML =
    mostBorrowed || "No borrowing records yet.";
    let activeMembers = students.length;

document.getElementById("activeMembers").innerText =
    "👥 Active Members: " + activeMembers;
}

</script>

</body>
</html>
