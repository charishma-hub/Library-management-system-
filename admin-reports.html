<!DOCTYPE html>
<html>
<head>
<title>Admin Reports</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>📊 Reports & Analytics</h1>

<div class="card">
<h2>Library Statistics</h2>

<label>Total Books</label>
<input type="number" id="total" value="500">

<label>Available Books</label>
<input type="number" id="available" value="350">

<label>Issued Books</label>
<input type="number" id="issued" value="150">

<label>Active Students</label>
<input type="number" id="students" value="250">

<label>Overdue Books</label>
<input type="number" id="overdue" value="20">

<label>Total Fines (₹)</label>
<input type="number" id="fines" value="2500">

<button type="button" onclick="
document.getElementById('report').innerHTML =
'📚 Total Books: ' + document.getElementById('totalBooks').value +
'<br>✅ Available Books: ' + document.getElementById('available').value +
'<br>📖 Issued Books: ' + document.getElementById('issued').value +
'<br>👨‍🎓 Active Students: ' + document.getElementById('students').value +
'<br>⚠️ Overdue Books: ' + document.getElementById('overdue').value +
'<br>💰 Total Fines: ₹' + document.getElementById('fines').value;
">
    Update Report
</button>

</div>

<div class="card">
<h2>📈 Current Report</h2>

<p id="report"></p>

</div>

<script>


function showReport() {

    let inputs = document.querySelectorAll('input[type="number"]');

    let totalBooks = inputs[0].value;
    let availableBooks = inputs[1].value;
    let issuedBooks = inputs[2].value;
    let activeStudents = inputs[3].value;
    let overdueBooks = inputs[4].value;
    let totalFines = inputs[5].value;

    document.getElementById("report").innerHTML =
        "📚 Total Books: " + totalBooks +
        "<br>✅ Available Books: " + availableBooks +
        "<br>📖 Issued Books: " + issuedBooks +
        "<br>👨‍🎓 Active Students: " + activeStudents +
        "<br>⚠️ Overdue Books: " + overdueBooks +
        "<br>💰 Total Fines: ₹" + totalFines;
}



</script>

<br>

<button onclick="window.location.href='admin-dashboard.html'">
Back to Admin Dashboard
</button>

</body>
</html>
