<!DOCTYPE html>
<html>
<head>
<title>Admin Reports</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>📊 Reports & Analytics</h1>

<div class="card">
<h2>Library Statistics</h2>

<label>Total Books</label>
<input type="number" id="total" value="500">

<label>Available Books</label>
<input type="number" id="available" value="350">

<label>Issued Books</label>
<input type="number" id="issued" value="150">

<label>Active Students</label>
<input type="number" id="students" value="250">

<label>Overdue Books</label>
<input type="number" id="overdue" value="20">

<label>Total Fines (₹)</label>
<input type="number" id="fines" value="2500">

<button type="button" onclick="showReport()">
Update Report
</button>

</div>

<div class="card">
<h2>📈 Current Report</h2>

<p id="report"></p>

</div>

<script>

function showReport() {

let total = document.getElementById("total").value;
let available = document.getElementById("available").value;
let issued = document.getElementById("issued").value;
let students = document.getElementById("students").value;
let overdue = document.getElementById("overdue").value;
let fines = document.getElementById("fines").value;

document.getElementById("report").innerHTML =
"Total Books: " + total + "<br>" +
"Available Books: " + available + "<br>" +
"Issued Books: " + issued + "<br>" +
"Active Students: " + students + "<br>" +
"Overdue Books: " + overdue + "<br>" +
"Total Fines: ₹" + fines;

}

</script>

<br>

<button onclick="window.location.href='admin-dashboard.html'">
Back to Admin Dashboard
</button>

</body>
</html>
