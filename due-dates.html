<!DOCTYPE html>
<html>
<head>
    <title>Due Dates</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>📅 Due Dates</h1>

<div class="card">

    <h2>My Book Due Dates</h2>

    <table border="1" width="100%">

        <thead>
            <tr>
                <th>Book Name</th>
                <th>Book ID / ISBN</th>
                <th>Due Date</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="dueTable">
        </tbody>

    </table>

    <p id="message"></p>

</div>

<br>

<button type="button"
onclick="window.location.href='student-dashboard.html'">
    Back to Student Dashboard
</button>

<script>

function loadDueDates() {

    let issuedBooks =
        JSON.parse(localStorage.getItem("issuedBooks")) || [];

    let studentId =
        localStorage.getItem("studentId");

    let table =
        document.getElementById("dueTable");

    let message =
        document.getElementById("message");

    table.innerHTML = "";

    if (!studentId) {
        message.innerText =
            "Please register/login as a student first.";
        return;
    }

    let myBooks = issuedBooks.filter(function(book) {
        return book.studentId === studentId;
    });

    if (myBooks.length === 0) {
        message.innerText =
            "No borrowed books found.";
        return;
    }

    let today = new Date();

    myBooks.forEach(function(book) {

        let dueDate = new Date(book.dueDate);

        let status;

        if (dueDate < today) {
            status = "⚠️ Overdue";
        } else {
            status = "✅ Not Due";
        }

        let row = table.insertRow();

        row.insertCell(0).innerText =
            book.bookName;

        row.insertCell(1).innerText =
            book.bookId;

        row.insertCell(2).innerText =
            book.dueDate;

        row.insertCell(3).innerText =
            status;
    });
}

loadDueDates();

</script>

</body>
</html>
