<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Due Dates - Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
        }

        .header {
            background: linear-gradient(135deg, #0f4c81, #1976d2);
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #0f4c81;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th {
            background: #eaf3ff;
            color: #0f4c81;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f8fbff;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }

        .not-due {
            background: #dcfce7;
            color: #166534;
        }

        .overdue {
            background: #fee2e2;
            color: #b91c1c;
        }

        .message {
            text-align: center;
            margin: 20px 0 5px;
            color: #64748b;
            font-weight: 500;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            padding: 12px 22px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #0f4c81;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 24px;
            }

            .card {
                padding: 18px;
            }

            .card h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📅 Due Dates</h1>
        <p>Track your borrowed books and return deadlines</p>
    </div>

    <div class="container">

        <div class="card">

            <h2>My Book Due Dates</h2>

            <div class="table-container">
                <table>

                    <thead>
                        <tr>
                            <th>📚 Book Name</th>
                            <th>🔖 Book ID / ISBN</th>
                            <th>📅 Due Date</th>
                            <th>📌 Status</th>
                        </tr>
                    </thead>

                    <tbody id="dueTable"></tbody>

                </table>
            </div>

            <p id="message" class="message"></p>

        </div>

        <a href="student-dashboard.html" class="back-btn">
            ← Back to Student Dashboard
        </a>

    </div>


<script>

function loadDueDates() {

    let issuedBooks =
        JSON.parse(localStorage.getItem("issuedBooks")) || [];

    let studentId =
        localStorage.getItem("studentId");

    let table =
        document.getElementById("dueTable");

    let message =
        document.getElementById("message");

    table.innerHTML = "";
    message.innerText = "";

    if (!studentId) {

        message.innerText =
            "Please register/login as a student first.";

        return;
    }

    let myBooks = issuedBooks.filter(function(book) {

        return book.studentId === studentId;

    });

    if (myBooks.length === 0) {

        message.innerText =
            "No borrowed books found.";

        return;
    }

    let today = new Date();

    myBooks.forEach(function(book) {

        let dueDate = new Date(book.dueDate);

        let row = table.insertRow();

        row.insertCell(0).innerText =
            book.bookName;

        row.insertCell(1).innerText =
            book.bookId;

        row.insertCell(2).innerText =
            book.dueDate;

        let statusCell = row.insertCell(3);

        let status = document.createElement("span");

        if (dueDate < today) {

            status.innerText = "⚠️ Overdue";
            status.className = "status overdue";

        } else {

            status.innerText = "✅ Not Due";
            status.className = "status not-due";

        }

        statusCell.appendChild(status);

    }
}

loadDueDates();

</script>

</body>
</html>
