<!DOCTYPE html>
<html>
<head>
<title>Library Attendance</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🚪 Library Entry / Exit</h1>

<div class="card">

<h2>Student Entry</h2>

<input type="text" id="studentId"
placeholder="Enter Student ID">

<button type="button" onclick="entry()">
Record Entry
</button>

<button type="button" onclick="exitLibrary()">
Record Exit
</button>

<p id="result"></p>

</div>

<script>

function entry() {

let id = document.getElementById("studentId").value;

if (id === "") {
alert("Please enter Student ID");
return;
}

document.getElementById("result").innerText =
"Entry recorded for Student ID: " + id;

}

function exitLibrary() {

let id = document.getElementById("studentId").value;

if (id === "") {
alert("Please enter Student ID");
return;
}

document.getElementById("result").innerText =
"Exit recorded for Student ID: " + id;

}

</script>

<br>

<button onclick="window.location.href='student-dashboard.html'">
Back to Student Dashboard
</button>

</body>
</html>
