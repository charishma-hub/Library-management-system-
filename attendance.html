<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Attendance | Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
        }

        .header {
            background: linear-gradient(135deg, #123b68, #2878bd);
            color: white;
            padding: 28px 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .header p {
            opacity: 0.9;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
        }

        .stat-icon {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 25px;
            font-weight: bold;
            color: #163b65;
        }

        .stat-label {
            color: #64748b;
            margin-top: 5px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .card h2 {
            color: #163b65;
            margin-bottom: 20px;
        }

        .label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d4dce7;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2878bd;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }

        button {
            border: none;
            padding: 13px 20px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            background: #2878bd;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .exit-btn {
            background: #163b65;
        }

        #result {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            color: #16803c;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #163b65;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #e5eaf0;
        }

        tr:hover td {
            background: #f7fbff;
        }

        .entry {
            color: #16803c;
            font-weight: bold;
        }

        .exit {
            color: #d35400;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        .back {
            display: inline-block;
            text-decoration: none;
            background: #163b65;
            color: white;
            padding: 12px 20px;
            border-radius: 9px;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .header h1 {
                font-size: 23px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            th,
            td {
                white-space: nowrap;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🚪 Library Attendance</h1>
        <p>Track student library entry and exit activity</p>
    </div>


    <div class="container">

        <!-- STATISTICS -->

        <div class="stats">

            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-number" id="totalRecords">0</div>
                <div class="stat-label">Total Records</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">🟢</div>
                <div class="stat-number" id="totalEntries">0</div>
                <div class="stat-label">Total Entries</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">🚪</div>
                <div class="stat-number" id="totalExits">0</div>
                <div class="stat-label">Total Exits</div>
            </div>

        </div>


        <!-- ENTRY / EXIT -->

        <div class="card">

            <h2>🧑‍🎓 Student Entry / Exit</h2>

            <label class="label">
                Student ID
            </label>

            <input
                type="text"
                id="studentId"
                placeholder="Enter Student ID">

            <div class="buttons">

                <button
                    type="button"
                    onclick="entry()">
                    🟢 Record Entry
                </button>

                <button
                    type="button"
                    class="exit-btn"
                    onclick="exitLibrary()">
                    🚪 Record Exit
                </button>

            </div>

            <p id="result"></p>

        </div>


        <!-- HISTORY -->

        <div class="card">

            <h2>📋 Attendance History</h2>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Action</th>
                            <th>Date</th>
                            <th>Time</th>
                        </tr>
                    </thead>

                    <tbody id="attendanceTable"></tbody>

                </table>

            </div>

        </div>


        <a
            href="student-dashboard.html"
            class="back">
            ← Back to Student Dashboard
        </a>

    </div>


<script>

function saveAttendance(studentId, action) {

    let attendance =
        JSON.parse(
            localStorage.getItem("attendance")
        ) || [];

    let now = new Date();

    attendance.push({

        studentId: studentId,

        action: action,

        date: now.toISOString().split("T")[0],

        time: now.toLocaleTimeString()

    });

    localStorage.setItem(
        "attendance",
        JSON.stringify(attendance)
    );

    displayAttendance();
}


function entry() {

    let id =
        document.getElementById("studentId")
        .value
        .trim();

    if (id === "") {

        alert("Please enter Student ID.");

        return;
    }

    saveAttendance(id, "Entry");

    document.getElementById("result").innerText =
        "✅ Entry recorded for Student ID: " + id;

    document.getElementById("studentId").value = "";

}


function exitLibrary() {

    let id =
        document.getElementById("studentId")
        .value
        .trim();

    if (id === "") {

        alert("Please enter Student ID.");

        return;
    }

    saveAttendance(id, "Exit");

    document.getElementById("result").innerText =
        "🚪 Exit recorded for Student ID: " + id;

    document.getElementById("studentId").value = "";

}


function displayAttendance() {

    let attendance =
        JSON.parse(
            localStorage.getItem("attendance")
        ) || [];

    let table =
        document.getElementById("attendanceTable");

    table.innerHTML = "";


    if (attendance.length === 0) {

        table.innerHTML =
            "<tr>" +
            "<td colspan='4' class='empty'>" +
            "No attendance records yet." +
            "</td>" +
            "</tr>";

    }


    attendance
        .slice()
        .reverse()
        .forEach(function(record) {

            let row = table.insertRow();

            row.insertCell(0).innerText =
                record.studentId;

            let actionCell =
                row.insertCell(1);

            actionCell.innerText =
                record.action;

            actionCell.className =
                record.action === "Entry"
                    ? "entry"
                    : "exit";

            row.insertCell(2).innerText =
                record.date;

            row.insertCell(3).innerText =
                record.time;

        });


    updateStatistics(attendance);
}


function updateStatistics(attendance) {

    let entries =
        attendance.filter(function(record) {

            return record.action === "Entry";

        }).length;


    let exits =
        attendance.filter(function(record) {

            return record.action === "Exit";

        }).length;


    document.getElementById("totalRecords")
        .innerText = attendance.length;

    document.getElementById("totalEntries")
        .innerText = entries;

    document.getElementById("totalExits")
        .innerText = exits;
}


displayAttendance();

</script>

</body>

</html>
