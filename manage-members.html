<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Members - Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
        }

        header {
            background: linear-gradient(135deg, #0f4c81, #1976d2);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 1050px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 0;
            color: #0f4c81;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1976d2;
        }

        .add-btn {
            margin-top: 18px;
            padding: 13px 24px;
            border: none;
            border-radius: 9px;
            background: #1976d2;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #0f4c81;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th {
            background: #eaf3ff;
            color: #0f4c81;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f8fbff;
        }

        .member-name {
            font-weight: bold;
            color: #1976d2;
        }

        .delete-btn {
            padding: 7px 12px;
            border: none;
            border-radius: 7px;
            background: #dc2626;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 25px auto;
            padding: 12px 22px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #0f4c81;
        }

        @media (max-width: 650px) {

            header h1 {
                font-size: 24px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>👥 Manage Members</h1>
    <p>Add, view and manage library members</p>
</header>

<div class="container">

    <!-- Add Member -->
    <div class="card">

        <h2>➕ Add New Member</h2>

        <div class="form-grid">

            <input
                type="text"
                id="memberName"
                placeholder="Member Name">

            <input
                type="text"
                id="memberId"
                placeholder="Student ID">

            <input
                type="email"
                id="memberEmail"
                placeholder="Email Address">

            <input
                type="text"
                id="memberPhone"
                placeholder="Phone Number">

        </div>

        <button class="add-btn" onclick="addMember()">
            + Add Member
        </button>

    </div>


    <!-- Member List -->
    <div class="card">

        <h2>📋 Member List</h2>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Student ID</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="memberTable"></tbody>

            </table>

        </div>

        <p id="emptyMessage" class="empty"></p>

    </div>


    <a href="librarian-dashboard.html" class="back-btn">
        ← Back to Librarian Dashboard
    </a>

</div>


<script>

function loadMembers() {

    let members =
        JSON.parse(localStorage.getItem("members")) || [];

    let table =
        document.getElementById("memberTable");

    let emptyMessage =
        document.getElementById("emptyMessage");

    table.innerHTML = "";
    emptyMessage.innerText = "";

    if (members.length === 0) {

        emptyMessage.innerText =
            "No members added yet.";

        return;
    }

    members.forEach(function(member, index) {

        let row = table.insertRow();

        let nameCell = row.insertCell(0);
        nameCell.innerText = member.name || "-";
        nameCell.className = "member-name";

        row.insertCell(1).innerText =
            member.studentId || "-";

        row.insertCell(2).innerText =
            member.email || "-";

        row.insertCell(3).innerText =
            member.phone || "-";

        let actionCell = row.insertCell(4);

        let deleteButton =
            document.createElement("button");

        deleteButton.innerText = "Delete";
        deleteButton.className = "delete-btn";

        deleteButton.onclick = function() {
            deleteMember(index);
        };

        actionCell.appendChild(deleteButton);
    });
}


function addMember() {

    let name =
        document.getElementById("memberName").value.trim();

    let id =
        document.getElementById("memberId").value.trim();

    let email =
        document.getElementById("memberEmail").value.trim();

    let phone =
        document.getElementById("memberPhone").value.trim();


    if (name === "" ||
        id === "" ||
        email === "" ||
        phone === "") {

        alert("Please fill all fields.");
        return;
    }


    let members =
        JSON.parse(localStorage.getItem("members")) || [];


    let alreadyExists = members.some(function(member) {

        return member.studentId === id;

    });


    if (alreadyExists) {

        alert("A member with this Student ID already exists.");
        return;
    }


    members.push({

        name: name,
        studentId: id,
        email: email,
        phone: phone

    });


    localStorage.setItem(
        "members",
        JSON.stringify(members)
    );


    document.getElementById("memberName").value = "";
    document.getElementById("memberId").value = "";
    document.getElementById("memberEmail").value = "";
    document.getElementById("memberPhone").value = "";


    loadMembers();

    alert("Member added successfully!");
}


function deleteMember(index) {

    if (!confirm("Are you sure you want to delete this member?")) {
        return;
    }


    let members =
        JSON.parse(localStorage.getItem("members")) || [];


    members.splice(index, 1);


    localStorage.setItem(
        "members",
        JSON.stringify(members)
    );


    loadMembers();

    alert("Member deleted successfully!");
}


loadMembers();

</script>

</body>
</html>
